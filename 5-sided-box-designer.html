<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5-Sided Box Designer v1.0.1</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5FRS651E26"></script>
    <script> window.dataLayer = window.dataLayer || []; function gtag() { dataLayer.push(arguments); } gtag('js', new Date()); gtag('config', 'G-5FRS651E26'); </script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useCallback, useEffect } = React;

        const BoxDesigner = () => {
          const [dimensionMode, setDimensionMode] = useState('interior');
          const [units, setUnits] = useState('inches');
          const [dimensions, setDimensions] = useState({ width: 6, depth: 4, height: 3 });
          const [materialThickness, setMaterialThickness] = useState(0.125);
          const [materialPreset, setMaterialPreset] = useState('0.125');
          const [bedSize, setBedSize] = useState({ width: 12, height: 20 });
          const [bedPreset, setBedPreset] = useState('12x20');
          const [zoomLevel, setZoomLevel] = useState(1);
          
          const [widthInput, setWidthInput] = useState('6');
          const [depthInput, setDepthInput] = useState('4');
          const [heightInput, setHeightInput] = useState('3');
          const [customThickness, setCustomThickness] = useState('');
          const [customBedWidth, setCustomBedWidth] = useState('');
          const [customBedHeight, setCustomBedHeight] = useState('');

          const convertToInches = (value) => units === 'mm' ? value / 25.4 : value;
          const convertFromInches = (value) => units === 'mm' ? value * 25.4 : value;
          const formatUnit = (value) => units === 'mm' ? value.toFixed(1) : value.toFixed(3);

          useEffect(() => {
            setWidthInput(formatUnit(convertFromInches(dimensions.width)));
            setDepthInput(formatUnit(convertFromInches(dimensions.depth)));
            setHeightInput(formatUnit(convertFromInches(dimensions.height)));
          }, [units]);

          useEffect(() => {
            if (materialPreset === 'custom') return;
            const presets = units === 'inches' 
              ? { '0.125': 0.125, '0.25': 0.25, '0.118': 0.118, '0.236': 0.236 }
              : { '3.0': 3.0 / 25.4, '6.0': 6.0 / 25.4, '3.175': 3.175 / 25.4, '6.35': 6.35 / 25.4 };
            setMaterialThickness(presets[materialPreset] || 0.125);
          }, [materialPreset, units]);

          const calculateExterior = useCallback(() => {
            if (dimensionMode === 'exterior') return dimensions;
            return {
              width: dimensions.width + (2 * materialThickness),
              depth: dimensions.depth + (2 * materialThickness),
              height: dimensions.height + materialThickness
            };
          }, [dimensions, materialThickness, dimensionMode]);

          const calculateInterior = useCallback(() => {
            if (dimensionMode === 'interior') return dimensions;
            return {
              width: dimensions.width - (2 * materialThickness),
              depth: dimensions.depth - (2 * materialThickness),
              height: dimensions.height - materialThickness
            };
          }, [dimensions, materialThickness, dimensionMode]);

          const calculateTabCount = (edgeLength) => Math.ceil(edgeLength / 2);

          const generateTabPositions = (edgeLength, numTabs, tabWidth) => {
            const spacing = edgeLength / numTabs;
            const positions = [];
            for (let i = 0; i < numTabs; i++) {
              const center = (i + 0.5) * spacing;
              positions.push({
                start: center - tabWidth / 2,
                end: center + tabWidth / 2
              });
            }
            return positions;
          };

          const generatePiecePath = (width, height, tabs, isBottom = false) => {
            const tabWidth = 0.5;
            const tabDepth = materialThickness;
            
            let path = `M 0 0 L ${width} 0`;
            
            // Top edge
            if (tabs.top) {
              const topTabs = generateTabPositions(width, tabs.top, tabWidth);
              path = `M 0 0`;
              topTabs.forEach(tab => {
                path += ` L ${tab.start} 0 L ${tab.start} ${-tabDepth} L ${tab.end} ${-tabDepth} L ${tab.end} 0`;
              });
              path += ` L ${width} 0`;
            }
            
            // Right edge
            path += ` L ${width} 0`;
            if (tabs.right) {
              const rightTabs = generateTabPositions(height, tabs.right, tabWidth);
              rightTabs.forEach(tab => {
                path += ` L ${width} ${tab.start} L ${width + tabDepth} ${tab.start} L ${width + tabDepth} ${tab.end} L ${width} ${tab.end}`;
              });
            }
            path += ` L ${width} ${height}`;
            
            // Bottom edge
            if (tabs.bottom) {
              const bottomTabs = generateTabPositions(width, tabs.bottom, tabWidth);
              for (let i = bottomTabs.length - 1; i >= 0; i--) {
                const tab = bottomTabs[i];
                path += ` L ${tab.end} ${height} L ${tab.end} ${height + tabDepth} L ${tab.start} ${height + tabDepth} L ${tab.start} ${height}`;
              }
            }
            path += ` L 0 ${height}`;
            
            // Left edge
            if (tabs.left) {
              const leftTabs = generateTabPositions(height, tabs.left, tabWidth);
              for (let i = leftTabs.length - 1; i >= 0; i--) {
                const tab = leftTabs[i];
                path += ` L 0 ${tab.end} L ${-tabDepth} ${tab.end} L ${-tabDepth} ${tab.start} L 0 ${tab.start}`;
              }
            }
            path += ` L 0 0 Z`;
            
            return path;
          };

          const generateNotchPath = (width, height, notches) => {
            const tabWidth = 0.5;
            const tabDepth = materialThickness;
            
            let path = `M 0 0`;
            
            // Top edge with notches
            if (notches.top) {
              const topNotches = generateTabPositions(width, notches.top, tabWidth);
              topNotches.forEach(notch => {
                path += ` L ${notch.start} 0 L ${notch.start} ${tabDepth} L ${notch.end} ${tabDepth} L ${notch.end} 0`;
              });
            }
            path += ` L ${width} 0`;
            
            // Right edge with notches
            if (notches.right) {
              const rightNotches = generateTabPositions(height, notches.right, tabWidth);
              rightNotches.forEach(notch => {
                path += ` L ${width} ${notch.start} L ${width - tabDepth} ${notch.start} L ${width - tabDepth} ${notch.end} L ${width} ${notch.end}`;
              });
            }
            path += ` L ${width} ${height}`;
            
            // Bottom edge with notches
            if (notches.bottom) {
              const bottomNotches = generateTabPositions(width, notches.bottom, tabWidth);
              for (let i = bottomNotches.length - 1; i >= 0; i--) {
                const notch = bottomNotches[i];
                path += ` L ${notch.end} ${height} L ${notch.end} ${height - tabDepth} L ${notch.start} ${height - tabDepth} L ${notch.start} ${height}`;
              }
            }
            path += ` L 0 ${height}`;
            
            // Left edge with notches
            if (notches.left) {
              const leftNotches = generateTabPositions(height, notches.left, tabWidth);
              for (let i = leftNotches.length - 1; i >= 0; i--) {
                const notch = leftNotches[i];
                path += ` L 0 ${notch.end} L ${tabDepth} ${notch.end} L ${tabDepth} ${notch.start} L 0 ${notch.start}`;
              }
            }
            path += ` L 0 0 Z`;
            
            return path;
          };

          const generateGeneralizedPath = (bodyWidth, bodyHeight, edges) => {
            const tabWidth = 0.5;
            const tabDepth = materialThickness;
            
            // Only calculate offset for horizontal (width) positioning
            const bottomDistribute = (edges.bottom && edges.bottom.distributeAcross) ? edges.bottom.distributeAcross : bodyWidth;
            const xOffset = (bottomDistribute - bodyWidth) / 2;
            
            let path = `M 0 0 L ${bodyWidth} 0`;
            
            // Right edge - tabs (no offset, aligned with body edge)
            if (edges.right && edges.right.tabs > 0) {
              const rightDistribute = edges.right.distributeAcross || bodyHeight;
              const rightTabs = generateTabPositions(rightDistribute, edges.right.tabs, tabWidth);
              rightTabs.forEach(tab => {
                path += ` L ${bodyWidth} ${tab.start} L ${bodyWidth + tabDepth} ${tab.start} L ${bodyWidth + tabDepth} ${tab.end} L ${bodyWidth} ${tab.end}`;
              });
            }
            path += ` L ${bodyWidth} ${bodyHeight}`;
            
            // Bottom edge - tabs (distributed across wider dimension, with offset)
            if (edges.bottom && edges.bottom.tabs > 0) {
              const bottomTabs = generateTabPositions(bottomDistribute, edges.bottom.tabs, tabWidth);
              for (let i = bottomTabs.length - 1; i >= 0; i--) {
                const tab = bottomTabs[i];
                // Adjust tab positions relative to body (shift by xOffset)
                const adjustedStart = tab.start - xOffset;
                const adjustedEnd = tab.end - xOffset;
                path += ` L ${adjustedEnd} ${bodyHeight} L ${adjustedEnd} ${bodyHeight + tabDepth} L ${adjustedStart} ${bodyHeight + tabDepth} L ${adjustedStart} ${bodyHeight}`;
              }
            }
            path += ` L 0 ${bodyHeight}`;
            
            // Left edge - tabs (no offset, aligned with body edge)
            if (edges.left && edges.left.tabs > 0) {
              const leftDistribute = edges.left.distributeAcross || bodyHeight;
              const leftTabs = generateTabPositions(leftDistribute, edges.left.tabs, tabWidth);
              for (let i = leftTabs.length - 1; i >= 0; i--) {
                const tab = leftTabs[i];
                path += ` L 0 ${tab.end} L ${-tabDepth} ${tab.end} L ${-tabDepth} ${tab.start} L 0 ${tab.start}`;
              }
            }
            path += ` L 0 0 Z`;
            
            return path;
          };

          const generateMixedPath = (width, height, tabs, notches) => {
            const tabWidth = 0.5;
            const tabDepth = materialThickness;
            
            let path = `M 0 0`;
            
            // Top edge - notches
            if (notches.top) {
              const topNotches = generateTabPositions(width, notches.top, tabWidth);
              topNotches.forEach(notch => {
                path += ` L ${notch.start} 0 L ${notch.start} ${tabDepth} L ${notch.end} ${tabDepth} L ${notch.end} 0`;
              });
            }
            path += ` L ${width} 0`;
            
            // Right edge - tabs or notches
            if (tabs.right) {
              const rightTabs = generateTabPositions(height, tabs.right, tabWidth);
              rightTabs.forEach(tab => {
                path += ` L ${width} ${tab.start} L ${width + tabDepth} ${tab.start} L ${width + tabDepth} ${tab.end} L ${width} ${tab.end}`;
              });
            } else if (notches.right) {
              const rightNotches = generateTabPositions(height, notches.right, tabWidth);
              rightNotches.forEach(notch => {
                path += ` L ${width} ${notch.start} L ${width - tabDepth} ${notch.start} L ${width - tabDepth} ${notch.end} L ${width} ${notch.end}`;
              });
            }
            path += ` L ${width} ${height}`;
            
            // Bottom edge - tabs or notches
            if (tabs.bottom) {
              const bottomTabs = generateTabPositions(width, tabs.bottom, tabWidth);
              for (let i = bottomTabs.length - 1; i >= 0; i--) {
                const tab = bottomTabs[i];
                path += ` L ${tab.end} ${height} L ${tab.end} ${height + tabDepth} L ${tab.start} ${height + tabDepth} L ${tab.start} ${height}`;
              }
            } else if (notches.bottom) {
              const bottomNotches = generateTabPositions(width, notches.bottom, tabWidth);
              for (let i = bottomNotches.length - 1; i >= 0; i--) {
                const notch = bottomNotches[i];
                path += ` L ${notch.end} ${height} L ${notch.end} ${height - tabDepth} L ${notch.start} ${height - tabDepth} L ${notch.start} ${height}`;
              }
            }
            path += ` L 0 ${height}`;
            
            // Left edge - tabs or notches
            if (tabs.left) {
              const leftTabs = generateTabPositions(height, tabs.left, tabWidth);
              for (let i = leftTabs.length - 1; i >= 0; i--) {
                const tab = leftTabs[i];
                path += ` L 0 ${tab.end} L ${-tabDepth} ${tab.end} L ${-tabDepth} ${tab.start} L 0 ${tab.start}`;
              }
            } else if (notches.left) {
              const leftNotches = generateTabPositions(height, notches.left, tabWidth);
              for (let i = leftNotches.length - 1; i >= 0; i--) {
                const notch = leftNotches[i];
                path += ` L 0 ${notch.end} L ${tabDepth} ${notch.end} L ${tabDepth} ${notch.start} L 0 ${notch.start}`;
              }
            }
            path += ` L 0 0 Z`;
            
            return path;
          };

          const checkBedFit = useCallback(() => {
            const ext = calculateExterior();
            const pieces = [
              { name: 'Front wall', width: ext.width, height: ext.height + (2 * materialThickness) },
              { name: 'Back wall', width: ext.width, height: ext.height + (2 * materialThickness) },
              { name: 'Left wall', width: ext.depth, height: ext.height + (2 * materialThickness) },
              { name: 'Right wall', width: ext.depth, height: ext.height + (2 * materialThickness) },
              { name: 'Bottom', width: ext.width, height: ext.depth }
            ];
            
            const largest = pieces.reduce((max, p) => 
              (p.width * p.height > max.width * max.height) ? p : max
            );
            
            const fits = largest.width <= bedSize.width && largest.height <= bedSize.height;
            const tight = largest.width > bedSize.width - 0.5 || largest.height > bedSize.height - 0.5;
            
            return { fits, tight, largest };
          }, [calculateExterior, materialThickness, bedSize]);

          const generateSVG = useCallback(() => {
            const ext = calculateExterior();
            const int = calculateInterior();
            const tabWidth = 0.5;
            const tabDepth = materialThickness;
            const spacing = 0.25;
            
            // Calculate piece dimensions with bounding boxes (including tab protrusions)
            const frontWidth = int.width;
            const frontHeight = int.height;
            const frontBBoxWidth = frontWidth + (2 * tabDepth); // tabs on left and right
            const frontBBoxHeight = frontHeight + tabDepth; // tab on bottom
            
            const backWidth = int.width;
            const backHeight = int.height;
            const backBBoxWidth = backWidth + (2 * tabDepth); // tabs on left and right
            const backBBoxHeight = backHeight + tabDepth; // tab on bottom
            
            const leftWidth = ext.depth;
            const leftHeight = int.height;
            const leftBBoxWidth = leftWidth + (2 * tabDepth); // notches on left and right (inward)
            const leftBBoxHeight = leftHeight + tabDepth; // tab on bottom
            
            const rightWidth = ext.depth;
            const rightHeight = int.height;
            const rightBBoxWidth = rightWidth + (2 * tabDepth); // notches on left and right (inward)
            const rightBBoxHeight = rightHeight + tabDepth; // tab on bottom
            
            const bottomWidth = ext.width;
            const bottomHeight = ext.depth;
            const bottomBBoxWidth = bottomWidth + (2 * tabDepth); // notches on left and right (inward)
            const bottomBBoxHeight = bottomHeight + (2 * tabDepth); // notches on top and bottom (inward)
            
            // Layout using bounding boxes
            const row1Height = Math.max(backBBoxHeight, frontBBoxHeight);
            const row2Height = Math.max(leftBBoxHeight, rightBBoxHeight, bottomBBoxHeight);
            
            let currentX = 0;
            let currentY = 0;
            
            // Back wall - offset by tab depth so piece starts at proper position
            const backX = currentX + tabDepth;
            const backY = currentY;
            currentX += backBBoxWidth + spacing;
            
            // Front wall - offset by tab depth
            const frontX = currentX + tabDepth;
            const frontY = currentY;
            
            // Move to next row
            const row1Width = backBBoxWidth + spacing + frontBBoxWidth;
            currentX = 0;
            currentY += row1Height + spacing;
            
            // Left wall - offset by tab depth (notches are inward, but still need offset for bottom tab)
            const leftX = currentX + tabDepth;
            const leftY = currentY;
            currentX += leftBBoxWidth + spacing;
            
            // Right wall - offset by tab depth
            const rightX = currentX + tabDepth;
            const rightY = currentY;
            currentX += rightBBoxWidth + spacing;
            
            // Bottom - offset by tab depth (notches are inward)
            const bottomX = currentX + tabDepth;
            const bottomY = currentY + tabDepth;
            
            const totalWidth = Math.max(row1Width, leftBBoxWidth + spacing + rightBBoxWidth + spacing + bottomBBoxWidth);
            const totalHeight = row1Height + spacing + row2Height;
            
            // Convert dimensions to selected units for SVG attributes
            const svgWidth = convertFromInches(totalWidth);
            const svgHeight = convertFromInches(totalHeight);
            
            let svg = `<?xml version="1.0" encoding="UTF-8"?>\n`;
            svg += `<!-- Generated by 5-Sided Box Designer v1.0.1 - https://greylightmay.com -->\n`;
            svg += `<svg width="${svgWidth}${units === 'mm' ? 'mm' : 'in'}" height="${svgHeight}${units === 'mm' ? 'mm' : 'in'}" viewBox="0 0 ${totalWidth} ${totalHeight}" xmlns="http://www.w3.org/2000/svg">\n`;
            svg += `  <defs>\n    <style>\n`;
            svg += `      .cut-line { stroke: rgb(255,0,0); stroke-width: 0.01; fill: none; }\n`;
            svg += `      .label-text { fill: rgb(0,255,0); font-family: Arial, sans-serif; font-size: 0.2in; font-weight: normal; }\n`;
            svg += `    </style>\n  </defs>\n`;
            
            // Back wall
            svg += `  <g id="back-wall" transform="translate(${backX}, ${backY})">\n`;
            svg += `    <path d="${generateGeneralizedPath(int.width, backHeight, {
              bottom: { tabs: calculateTabCount(ext.width), distributeAcross: ext.width },
              left: { tabs: calculateTabCount(int.height), distributeAcross: int.height },
              right: { tabs: calculateTabCount(int.height), distributeAcross: int.height },
              top: { tabs: 0 }
            })}" class="cut-line" />\n`;
            svg += `  </g>\n`;
            
            // Front wall
            svg += `  <g id="front-wall" transform="translate(${frontX}, ${frontY})">\n`;
            svg += `    <path d="${generateGeneralizedPath(int.width, frontHeight, {
              bottom: { tabs: calculateTabCount(ext.width), distributeAcross: ext.width },
              left: { tabs: calculateTabCount(int.height), distributeAcross: int.height },
              right: { tabs: calculateTabCount(int.height), distributeAcross: int.height },
              top: { tabs: 0 }
            })}" class="cut-line" />\n`;
            svg += `  </g>\n`;
            
            // Left wall (with mixed tabs/notches)
            svg += `  <g id="left-wall" transform="translate(${leftX}, ${leftY})">\n`;
            svg += `    <path d="${generateMixedPath(leftWidth, leftHeight, {
              bottom: calculateTabCount(leftWidth),
              top: 0,
              left: 0,
              right: 0
            }, {
              bottom: 0,
              top: 0,
              left: calculateTabCount(ext.height),
              right: calculateTabCount(ext.height)
            })}" class="cut-line" />\n`;
            svg += `  </g>\n`;
            
            // Right wall (with mixed tabs/notches)
            svg += `  <g id="right-wall" transform="translate(${rightX}, ${rightY})">\n`;
            svg += `    <path d="${generateMixedPath(rightWidth, rightHeight, {
              bottom: calculateTabCount(rightWidth),
              top: 0,
              left: 0,
              right: 0
            }, {
              bottom: 0,
              top: 0,
              left: calculateTabCount(ext.height),
              right: calculateTabCount(ext.height)
            })}" class="cut-line" />\n`;
            svg += `  </g>\n`;
            
            // Bottom
            svg += `  <g id="bottom" transform="translate(${bottomX}, ${bottomY})">\n`;
            svg += `    <path d="${generateNotchPath(bottomWidth, bottomHeight, {
              top: calculateTabCount(bottomWidth),
              bottom: calculateTabCount(bottomWidth),
              left: calculateTabCount(bottomHeight),
              right: calculateTabCount(bottomHeight)
            })}" class="cut-line" />\n`;
            svg += `  </g>\n`;
            
            svg += `</svg>`;
            return svg;
          }, [calculateExterior, calculateInterior, materialThickness, units, calculateTabCount, generateGeneralizedPath, generateMixedPath, generateNotchPath, convertFromInches]);

          const downloadSVG = () => {
            // Track the download event
            gtag('event', 'download_svg', {
              'tool_name': '5_sided_box_designer'
            });
            const svgContent = generateSVG();
            const blob = new Blob([svgContent], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            const dims = `${formatUnit(convertFromInches(dimensions.width))}x${formatUnit(convertFromInches(dimensions.depth))}x${formatUnit(convertFromInches(dimensions.height))}`;
            link.download = `5-sided-box-${dimensionMode}-${dims}${units === 'mm' ? 'mm' : 'in'}.svg`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
          };

          const handleDimensionChange = (field, value) => {
            const numValue = parseFloat(value);
            if (isNaN(numValue) || numValue <= 0) return;
            const inchValue = convertToInches(numValue);
            setDimensions(prev => ({ ...prev, [field]: inchValue }));
          };

          const handleThicknessChange = (value) => {
            const numValue = parseFloat(value);
            if (isNaN(numValue) || numValue <= 0) return;
            setMaterialThickness(convertToInches(numValue));
          };

          const bedCheck = checkBedFit();
          const interior = calculateInterior();
          const exterior = calculateExterior();

          return (
            <div className="max-w-7xl mx-auto p-6 bg-white">
              <h1 className="text-3xl font-bold text-center mb-2 text-gray-800">5-Sided Box Designer</h1>
              <p className="text-center text-gray-600 mb-1">Create laser-cut boxes with tab-and-notch joinery</p>
              <p className="text-center text-gray-500 text-sm mb-8">v1.0.1</p>
              
              <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                {/* Settings Column */}
                <div className="space-y-6">
                  {/* Dimension Mode */}
                  <div className="bg-gray-50 p-6 rounded-lg">
                    <h2 className="text-xl font-semibold text-gray-700 mb-4">Dimension Mode</h2>
                    <div className="space-y-2">
                      <label className="flex items-center cursor-pointer">
                        <input type="radio" checked={dimensionMode === 'interior'} onChange={() => setDimensionMode('interior')} className="mr-3" />
                        <div>
                          <div className="font-medium">Interior</div>
                          <div className="text-sm text-gray-500">Specify the usable space inside</div>
                        </div>
                      </label>
                      <label className="flex items-center cursor-pointer">
                        <input type="radio" checked={dimensionMode === 'exterior'} onChange={() => setDimensionMode('exterior')} className="mr-3" />
                        <div>
                          <div className="font-medium">Exterior</div>
                          <div className="text-sm text-gray-500">Specify the outside dimensions</div>
                        </div>
                      </label>
                    </div>
                  </div>

                  {/* Units */}
                  <div className="bg-gray-50 p-6 rounded-lg">
                    <h2 className="text-xl font-semibold text-gray-700 mb-4">Units</h2>
                    <div className="flex gap-4">
                      <label className="flex items-center cursor-pointer">
                        <input type="radio" checked={units === 'inches'} onChange={() => setUnits('inches')} className="mr-2" />
                        <span>Inches</span>
                      </label>
                      <label className="flex items-center cursor-pointer">
                        <input type="radio" checked={units === 'mm'} onChange={() => setUnits('mm')} className="mr-2" />
                        <span>Millimeters</span>
                      </label>
                    </div>
                  </div>

                  {/* Box Dimensions */}
                  <div className="bg-gray-50 p-6 rounded-lg">
                    <h2 className="text-xl font-semibold text-gray-700 mb-4">Box Dimensions</h2>
                    <div className="space-y-4">
                      <div>
                        <label className="block text-sm font-medium text-gray-600 mb-1">Width ({units})</label>
                        <input type="number" value={widthInput} onChange={(e) => { setWidthInput(e.target.value); handleDimensionChange('width', e.target.value); }} step={units === 'mm' ? '1' : '0.125'} className="w-full px-3 py-2 border border-gray-300 rounded" />
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-gray-600 mb-1">Depth ({units})</label>
                        <input type="number" value={depthInput} onChange={(e) => { setDepthInput(e.target.value); handleDimensionChange('depth', e.target.value); }} step={units === 'mm' ? '1' : '0.125'} className="w-full px-3 py-2 border border-gray-300 rounded" />
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-gray-600 mb-1">Height ({units})</label>
                        <input type="number" value={heightInput} onChange={(e) => { setHeightInput(e.target.value); handleDimensionChange('height', e.target.value); }} step={units === 'mm' ? '1' : '0.125'} className="w-full px-3 py-2 border border-gray-300 rounded" />
                      </div>
                    </div>
                    <div className="mt-4 pt-4 border-t border-gray-200">
                      <div className="text-sm space-y-1">
                        <p className="text-gray-600 font-medium">Calculated Dimensions:</p>
                        <p className="text-gray-700">Interior: {formatUnit(convertFromInches(interior.width))} × {formatUnit(convertFromInches(interior.depth))} × {formatUnit(convertFromInches(interior.height))} {units}</p>
                        <p className="text-gray-700">Exterior: {formatUnit(convertFromInches(exterior.width))} × {formatUnit(convertFromInches(exterior.depth))} × {formatUnit(convertFromInches(exterior.height))} {units}</p>
                      </div>
                    </div>
                  </div>

                  {/* Material Thickness */}
                  <div className="bg-gray-50 p-6 rounded-lg">
                    <h2 className="text-xl font-semibold text-gray-700 mb-4">Material Thickness</h2>
                    <div className="mb-3">
                      <select value={materialPreset} onChange={(e) => { setMaterialPreset(e.target.value); if (e.target.value !== 'custom') setCustomThickness(''); }} className="w-full px-3 py-2 border border-gray-300 rounded">
                        {units === 'inches' ? (
                          <>
                            <option value="0.125">1/8" (0.125")</option>
                            <option value="0.118">Nominal 1/8" (0.118")</option>
                            <option value="0.25">1/4" (0.250")</option>
                            <option value="0.236">Nominal 1/4" (0.236")</option>
                          </>
                        ) : (
                          <>
                            <option value="3.0">3.0mm</option>
                            <option value="3.175">3.175mm (1/8")</option>
                            <option value="6.0">6.0mm</option>
                            <option value="6.35">6.35mm (1/4")</option>
                          </>
                        )}
                        <option value="custom">Custom</option>
                      </select>
                    </div>
                    {materialPreset === 'custom' && (
                      <div>
                        <input type="number" value={customThickness} onChange={(e) => { setCustomThickness(e.target.value); handleThicknessChange(e.target.value); }} placeholder={`Enter thickness in ${units}`} step={units === 'mm' ? '0.1' : '0.001'} className="w-full px-3 py-2 border border-gray-300 rounded" />
                      </div>
                    )}
                    <p className="text-xs text-gray-500 mt-2">Current: {formatUnit(convertFromInches(materialThickness))} {units}</p>
                  </div>

                  {/* Material Size Check */}
                  <div className="bg-gray-50 p-6 rounded-lg">
                    <h2 className="text-xl font-semibold text-gray-700 mb-4">Material Size Check</h2>
                    <div className="mb-4">
                      <label className="block text-sm font-medium text-gray-600 mb-1">Your Material or Laser Bed Size</label>
                      <select value={bedPreset} onChange={(e) => { setBedPreset(e.target.value); if (e.target.value !== 'custom') { const [w, h] = e.target.value.split('x').map(Number); setBedSize({ width: w, height: h }); } }} className="w-full px-3 py-2 border border-gray-300 rounded">
                        <option value="12x12">12" × 12"</option>
                        <option value="12x20">12" × 20"</option>
                        <option value="20x28">20" × 28"</option>
                        <option value="24x36">24" × 36"</option>
                        <option value="40x28">40" × 28"</option>
                        <option value="custom">Custom</option>
                      </select>
                    </div>
                    {bedPreset === 'custom' && (
                      <div className="grid grid-cols-2 gap-2 mb-4">
                        <input type="number" placeholder="Width" value={customBedWidth} onChange={(e) => { setCustomBedWidth(e.target.value); const v = parseFloat(e.target.value); if (!isNaN(v) && v > 0) setBedSize(p => ({ ...p, width: v })); }} className="px-3 py-2 border border-gray-300 rounded" />
                        <input type="number" placeholder="Depth" value={customBedHeight} onChange={(e) => { setCustomBedHeight(e.target.value); const v = parseFloat(e.target.value); if (!isNaN(v) && v > 0) setBedSize(p => ({ ...p, height: v })); }} className="px-3 py-2 border border-gray-300 rounded" />
                      </div>
                    )}
                    <div className={`rounded p-3 border ${bedCheck.fits ? (bedCheck.tight ? 'bg-yellow-50 border-yellow-200' : 'bg-green-50 border-green-200') : 'bg-red-50 border-red-200'}`}>
                      <p className={`font-semibold ${bedCheck.fits ? (bedCheck.tight ? 'text-yellow-800' : 'text-green-800') : 'text-red-800'}`}>
                        {bedCheck.fits ? (bedCheck.tight ? '⚠️ Tight fit - verify carefully' : '✅ All pieces fit') : '🚫 Won\'t fit!'}
                      </p>
                      <p className={`text-sm ${bedCheck.fits ? (bedCheck.tight ? 'text-yellow-700' : 'text-green-700') : 'text-red-700'}`}>
                        Largest: {bedCheck.largest.width.toFixed(2)}" × {bedCheck.largest.height.toFixed(2)}" ({bedCheck.largest.name})
                      </p>
                      {!bedCheck.fits && (
                        <p className="text-sm text-red-700">Your bed: {bedSize.width}" × {bedSize.height}"</p>
                      )}
                    </div>
                  </div>

                  {/* Color Convention */}
                  <div className="bg-gray-50 p-4 rounded-lg border border-gray-200 text-sm">
                    <h3 className="font-semibold text-gray-700 mb-2">🎨 SVG Color Guide</h3>
                    <div className="space-y-1 text-gray-600">
                      <p>🔴 Red = Cut lines</p>
                      <p>🔵 Blue = Scoring/line engraving</p>
                      <p>⚫ Black = Raster/fill engraving</p>
                      <p>🟢 Green = Labels (reference only)</p>
                    </div>
                  </div>

                  {/* Download Button */}
                  <button onClick={downloadSVG} className="w-full bg-blue-600 text-white py-3 px-6 rounded-lg hover:bg-blue-700 transition-colors font-semibold">
                    Download SVG File
                  </button>
                </div>

                {/* Preview Column */}
                <div className="space-y-4">
                  <div className="flex items-center justify-between">
                    <h2 className="text-xl font-semibold text-gray-700">Preview</h2>
                    <select value={zoomLevel} onChange={(e) => setZoomLevel(parseFloat(e.target.value))} className="px-2 py-1 border border-gray-300 rounded text-sm">
                      <option value={0.5}>50%</option>
                      <option value={1}>100%</option>
                      <option value={1.5}>150%</option>
                      <option value={2}>200%</option>
                    </select>
                  </div>
                  
                  <div className="border border-gray-300 rounded-lg p-4 bg-white" style={{ maxHeight: '800px', width: '100%', overflowX: 'auto', overflowY: 'auto' }}>
                    <div className="text-center mb-4">
                      <p className="text-sm text-gray-600 font-semibold">Unfolded Pattern (Inside View)</p>
                      <p className="text-xs text-gray-500">Shows how pieces connect - walls sit on top of bottom</p>
                    </div>
                    <svg width={`${(exterior.width * 2 + 1) * 96 * zoomLevel}px`} height={`${(exterior.height + exterior.depth + 1.5) * 96 * zoomLevel}px`} viewBox={`-0.5 -0.5 ${exterior.width * 2 + 2} ${(exterior.height * 2) + exterior.depth + 2.5}`} style={{ background: '#f9fafb', display: 'block' }}>
                      <defs>
                        <style>{`.cut-line { stroke: #dc2626; stroke-width: 0.02; fill: #f3e5ab; } .label { fill: #10b981; font-family: Arial; font-size: 0.3px; }`}</style>
                      </defs>
                      
                      {/* Back Wall (top) - centered above bottom */}
                      <g transform={`translate(${exterior.depth + 0.25 + (exterior.width / 2) - (exterior.width / 2) + materialThickness}, ${exterior.height + materialThickness + 0.5 - (interior.height) - 0.25})`}>
                        <path d={generateGeneralizedPath(interior.width, interior.height, {
                          bottom: { tabs: calculateTabCount(exterior.width), distributeAcross: exterior.width },
                          left: { tabs: calculateTabCount(interior.height), distributeAcross: interior.height },
                          right: { tabs: calculateTabCount(interior.height), distributeAcross: interior.height },
                          top: { tabs: 0 }
                        })} className="cut-line" />
                        <text className="label" x={interior.width / 2} y={-0.3} textAnchor="middle">Back</text>
                      </g>
                      
                      {/* Left, Bottom, Right (middle row) */}
                      <g transform={`translate(0, ${exterior.height + materialThickness + 0.5})`}>
                        {/* Left wall - rotated and positioned to the left of bottom */}
                        <g transform={`translate(${exterior.depth + 0.25 - 0.25}, ${exterior.depth / 2}) rotate(-90) translate(${-exterior.depth / 2}, ${-(interior.height)})`}>
                          <path d={generateMixedPath(exterior.depth, interior.height, {
                            bottom: calculateTabCount(exterior.depth),
                            top: 0,
                            left: 0,
                            right: 0
                          }, {
                            bottom: 0,
                            top: 0,
                            left: calculateTabCount(exterior.height),
                            right: calculateTabCount(exterior.height)
                          })} className="cut-line" />
                          <text className="label" x={exterior.depth / 2} y={-0.2} textAnchor="middle">Left</text>
                        </g>
                        
                        {/* Bottom panel */}
                        <g transform={`translate(${exterior.depth + 0.25}, 0)`}>
                          <path d={generateNotchPath(exterior.width, exterior.depth, {
                            top: calculateTabCount(exterior.width),
                            bottom: calculateTabCount(exterior.width),
                            left: calculateTabCount(exterior.depth),
                            right: calculateTabCount(exterior.depth)
                          })} className="cut-line" />
                          <text className="label" x={exterior.width / 2} y={exterior.depth / 2} textAnchor="middle" fill="#666">Bottom</text>
                        </g>
                        
                        {/* Right wall - rotated and positioned to the right of bottom */}
                        <g transform={`translate(${exterior.depth + 0.5 + exterior.width + (interior.height)}, ${exterior.depth / 2}) rotate(90) translate(${-exterior.depth / 2}, 0)`}>
                          <path d={generateMixedPath(exterior.depth, interior.height, {
                            bottom: calculateTabCount(exterior.depth),
                            top: 0,
                            left: 0,
                            right: 0
                          }, {
                            bottom: 0,
                            top: 0,
                            left: calculateTabCount(exterior.height),
                            right: calculateTabCount(exterior.height)
                          })} className="cut-line" />
                          <text className="label" x={exterior.depth / 2} y={-0.2} textAnchor="middle">Right</text>
                        </g>
                      </g>
                      
                      {/* Front Wall (bottom) - positioned below bottom panel */}
                      <g transform={`translate(${exterior.depth + 0.25 + (exterior.width / 2) - materialThickness}, ${exterior.height + materialThickness + 0.5 + exterior.depth + (interior.height) + 0.25}) rotate(180) translate(${-exterior.width / 2}, 0)`}>
                        <path d={generateGeneralizedPath(interior.width, interior.height, {
                          bottom: { tabs: calculateTabCount(exterior.width), distributeAcross: exterior.width },
                          left: { tabs: calculateTabCount(interior.height), distributeAcross: interior.height },
                          right: { tabs: calculateTabCount(interior.height), distributeAcross: interior.height },
                          top: { tabs: 0 }
                        })} className="cut-line" />
                        <text className="label" x={interior.width / 2} y={-0.3} textAnchor="middle">Front</text>
                      </g>
                    </svg>
                  </div>
                  
                  <div className="text-sm text-gray-600 space-y-1">
                    <p><strong>Assembly:</strong></p>
                    <p>• Walls sit on top of bottom piece (gravity helps)</p>
                    <p>• Front/Back walls have tabs on 3 sides</p>
                    <p>• Left/Right walls have notches to receive tabs</p>
                    <p>• Bottom has notches on all 4 edges</p>
                  </div>
                </div>
              </div>
            </div>
          );
        };

        ReactDOM.render(<BoxDesigner />, document.getElementById('root'));
    </script>
</body>
</html>
