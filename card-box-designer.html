                  {/* Color Guide */}
                  <div className="bg-gray-50 p-4 rounded-lg border border-gray-200 text-sm">
                    <h3 className="font-semibold text-gray-700 mb-2">SVG Color Guide</h3>
                    <div className="space-y-1 text-gray-600">
                      <p>Red = Cut lines</p>
                      <p>Green = Labels (reference only)</p>
                      <p>Blue = Scoring/line engraving</p>
                      <p>Black = Raster/fill engraving</p>
                    </div>
                  </div>

                  {/* Filename */}
                  <div className="bg-gray-50 p-6 rounded-lg">
                    <h2 className="text-xl font-semibold text-gray-700 mb-4">Filename</h2>
                    <div className="flex items-center">
                      <input type="text" value={filename} onChange={(e) => setFilename(e.target.value)} placeholder="e.g., poker-card-box" className="flex-1 px-3 py-2 border border-gray-300 rounded-l" />
                      <span className="px-3 py-2 bg-gray-200 border border-l-0 border-gray-300 rounded-r text-gray-600">.svg</span>
                    </div>
                  </div>

                  {/* Download Buttons */}
                  <div className="space-y-3">
                    <button onClick={downloadBoxSVG} className="w-full bg-blue-600 text-white py-3 px-6 rounded-lg hover:bg-blue-700 transition-colors font-semibold">
                      Download Box + Fixed Dividers
                    </button>
                    <button onClick={downloadFlexibleDividersSVG} className="w-full bg-green-600 text-white py-3 px-6 rounded-lg hover:bg-green-700 transition-colors font-semibold">
                      Download Flexible Divider Templates
                    </button>
                    {includeLid && (
                      <button onClick={downloadLidSVG} className="w-full bg-purple-600 text-white py-3 px-6 rounded-lg hover:bg-purple-700 transition-colors font-semibold">
                        Download Lid
                      </button>
                    )}
                  </div>
                </div>

                {/* Preview Column */}
                <div className="space-y-4">
                  <div className="flex items-center justify-between">
                    <h2 className="text-xl font-semibold text-gray-700">Preview</h2>
                    <select value={zoomLevel} onChange={(e) => setZoomLevel(parseFloat(e.target.value))} className="px-2 py-1 border border-gray-300 rounded text-sm">
                      <option value={0.5}>50%</option>
                      <option value={1}>100%</option>
                      <option value={1.5}>150%</option>
                      <option value={2}>200%</option>
                    </select>
                  </div>

                  <div className="border border-gray-300 rounded-lg p-4 bg-white" style={{ maxHeight: '600px', width: '100%', overflowX: 'auto', overflowY: 'auto' }}>
                    <div className="text-center mb-4">
                      <p className="text-sm text-gray-600 font-semibold">Top-Down View</p>
                      <p className="text-xs text-gray-500">Shows column layout with fixed dividers</p>
                    </div>

                    <svg
                      width={`${dims.exteriorWidth * 60 * zoomLevel}px`}
                      height={`${dims.exteriorDepth * 60 * zoomLevel}px`}
                      viewBox={`0 0 ${dims.exteriorWidth} ${dims.exteriorDepth}`}
                      style={{ background: '#f9fafb', display: 'block', margin: '0 auto' }}
                    >
                      {/* Box outline */}
                      <rect x="0" y="0" width={dims.exteriorWidth} height={dims.exteriorDepth} fill="none" stroke="#3b82f6" strokeWidth="0.02" />

                      {/* Walls */}
                      <rect x="0" y="0" width={materialThickness} height={dims.exteriorDepth} fill="#a3a3a3" /> {/* Left wall */}
                      <rect x={dims.exteriorWidth - materialThickness} y="0" width={materialThickness} height={dims.exteriorDepth} fill="#a3a3a3" /> {/* Right wall */}
                      <rect x="0" y="0" width={dims.exteriorWidth} height={materialThickness} fill="#a3a3a3" /> {/* Back wall */}
                      <rect x="0" y={dims.exteriorDepth - materialThickness} width={dims.exteriorWidth} height={materialThickness} fill="#a3a3a3" /> {/* Front wall */}

                      {/* Fixed dividers and columns */}
                      {(() => {
                        const elements = [];
                        let x = materialThickness; // Start after left wall

                        for (let i = 0; i <= numColumns; i++) {
                          // Divider
                          elements.push(
                            <rect
                              key={`divider-${i}`}
                              x={x}
                              y={materialThickness}
                              width={materialThickness}
                              height={dims.interiorDepth}
                              fill="#8b5a2b"
                            />
                          );

                          // Column (except after last divider)
                          if (i < numColumns) {
                            elements.push(
                              <rect
                                key={`column-${i}`}
                                x={x + materialThickness}
                                y={materialThickness}
                                width={columnWidth}
                                height={dims.interiorDepth}
                                fill="#f3e5ab"
                              />
                            );

                            // Column label
                            const labelX = x + materialThickness + columnWidth / 2;
                            const labelY = dims.exteriorDepth / 2;
                            elements.push(
                              <text
                                key={`label-${i}`}
                                x={labelX}
                                y={labelY}
                                textAnchor="middle"
                                dominantBaseline="middle"
                                fontSize={Math.min(columnWidth, dims.interiorDepth) * 0.15}
                                fill="#666"
                              >
                                {formatUnit(convertFromInches(columnWidth))}
                              </text>
                            );

                            x += materialThickness + columnWidth;
                          }
                        }

                        return elements;
                      })()}
                    </svg>
                  </div>

                  <div className="text-sm text-gray-600 space-y-1">
                    <p><strong>Assembly:</strong></p>
                    <p>1. Assemble box walls using tab-and-notch joints</p>
                    <p>2. Insert fixed dividers - tabs slot into front/back walls</p>
                    <p>3. Place flexible dividers in slots as needed</p>
                    <p></p>
                    <p><strong>Fixed dividers:</strong> Have slots along top edge</p>
                    <p><strong>Flexible dividers:</strong> Side tabs slide into slots</p>
                  </div>

                  {/* Box Construction Preview */}
                  <div className="flex items-center justify-between mt-6">
                    <div className="text-center flex-1">
                      <p className="text-sm text-gray-600 font-semibold">Box Construction (Unfolded)</p>
                      <p className="text-xs text-gray-500">Front, Back, Left, Right walls + Bottom</p>
                    </div>
                    <select value={boxZoomLevel} onChange={(e) => setBoxZoomLevel(parseFloat(e.target.value))} className="px-2 py-1 border border-gray-300 rounded text-sm">
                      <option value={0.25}>25%</option>
                      <option value={0.5}>50%</option>
                      <option value={1}>100%</option>
                      <option value={1.5}>150%</option>
                      <option value={2}>200%</option>
                    </select>
                  </div>
                  <div className="border border-gray-300 rounded-lg p-4 bg-white" style={{ maxHeight: '400px', width: '100%', overflowX: 'auto', overflowY: 'auto' }}>
                    {(() => {
                      const ext = { width: dims.exteriorWidth, depth: dims.exteriorDepth, height: dims.interiorHeight };
                      const sideW = dims.interiorDepth;
                      // Match 5-sided-box-designer: width = exterior.width * 2 + 2, height = exterior.height * 2 + exterior.depth + 2.5
                      const previewWidth = ext.width * 2 + 2;
                      const previewHeight = ext.height * 2 + ext.depth + 2.5;

                      return (
                        <svg
                          width={`${previewWidth * 96 * boxZoomLevel}px`}
                          height={`${(ext.height + ext.depth + 1.5) * 96 * boxZoomLevel}px`}
                          viewBox={`-0.5 -0.5 ${previewWidth} ${previewHeight}`}
                          style={{ background: '#f9fafb', display: 'block' }}
                        >
                          <defs>
                            <style>{`.box-cut { stroke: #dc2626; stroke-width: 0.02; fill: #f3e5ab; } .box-label { fill: #666; font-family: Arial; font-size: 0.25px; }`}</style>
                          </defs>

                          {/* Back Wall (top center) - notches on sides, tabs at bottom point toward bottom panel */}
                          <g transform={`translate(${ext.depth + 0.25}, ${ext.height + materialThickness + 0.5 - ext.height - 0.25})`}>
                            <path d={generateFrontBackWall(dims.exteriorWidth, ext.height, getDividerPositions(), dividerHeight)} className="box-cut" />
                            <text className="box-label" x={dims.exteriorWidth / 2} y={-0.15} textAnchor="middle">Back</text>
                          </g>

                          {/* Middle row: Left Wall, Bottom, Right Wall */}
                          <g transform={`translate(0, ${ext.height + materialThickness + 0.5})`}>
                            {/* Left wall - rotated and positioned to the left of bottom */}
                            {/* Center based on path body center (sideW/2), which equals bounding box center */}
                            <g transform={`translate(${ext.depth}, ${ext.depth / 2}) rotate(-90) translate(${-sideW / 2}, ${-ext.height})`}>
                              <path d={generateSideWall(sideW, ext.height)} className="box-cut" />
                              <text className="box-label" x={sideW / 2} y={-0.2} textAnchor="middle">Left</text>
                            </g>

                            {/* Bottom panel */}
                            <g transform={`translate(${ext.depth + 0.25}, 0)`}>
                              <path d={generateBottom(dims.exteriorWidth, dims.exteriorDepth, sideW)} className="box-cut" />
                              <text className="box-label" x={dims.exteriorWidth / 2} y={dims.exteriorDepth / 2} textAnchor="middle" dominantBaseline="middle">Bottom</text>
                            </g>

                            {/* Right wall - rotated and positioned to the right of bottom */}
                            {/* Center based on path body center (sideW/2), which equals bounding box center */}
                            <g transform={`translate(${ext.depth + 0.5 + dims.exteriorWidth + ext.height}, ${ext.depth / 2}) rotate(90) translate(${-sideW / 2}, 0)`}>
                              <path d={generateSideWall(sideW, ext.height)} className="box-cut" />
                              <text className="box-label" x={sideW / 2} y={-0.2} textAnchor="middle">Right</text>
                            </g>
                          </g>

                          {/* Front Wall (bottom center) - rotated 180° so bottom tabs point toward bottom panel */}
                          <g transform={`translate(${ext.depth + 0.25 + (dims.exteriorWidth / 2)}, ${ext.height + materialThickness + 0.5 + ext.depth + ext.height + 0.25}) rotate(180) translate(${-dims.exteriorWidth / 2}, 0)`}>
                            <path d={generateFrontBackWall(dims.exteriorWidth, ext.height, getDividerPositions(), dividerHeight)} className="box-cut" />
                            <text className="box-label" x={dims.exteriorWidth / 2} y={-0.3} textAnchor="middle">Front</text>
                          </g>
                        </svg>
                      );
                    })()}
                  </div>

                  {/* Lid Construction Preview */}
                  {includeLid && (
                    <>
                    <div className="flex items-center justify-between mt-6">
                      <div className="text-center flex-1">
                        <p className="text-sm text-gray-600 font-semibold">Lid Construction (Unfolded)</p>
                        <p className="text-xs text-gray-500">Front, Back, Left, Right walls + Top</p>
                      </div>
                      <select value={lidZoomLevel} onChange={(e) => setLidZoomLevel(parseFloat(e.target.value))} className="px-2 py-1 border border-gray-300 rounded text-sm">
                        <option value={0.25}>25%</option>
                        <option value={0.5}>50%</option>
                        <option value={1}>100%</option>
                        <option value={1.5}>150%</option>
                        <option value={2}>200%</option>
                      </select>
                    </div>
                    <div className="border border-gray-300 rounded-lg p-4 bg-white" style={{ maxHeight: '400px', width: '100%', overflowX: 'auto', overflowY: 'auto' }}>
                      {(() => {
                        const lidIntW = dims.exteriorWidth + (2 * lidClearance);
                        const lidIntD = dims.exteriorDepth + (2 * lidClearance);
                        const lidExtW = lidIntW + (2 * materialThickness);
                        const lidExtD = lidIntD + (2 * materialThickness);
                        const lidSideW = lidIntD;
                        // Match 5-sided-box-designer pattern
                        const previewWidth = lidExtW * 2 + 2;
                        const previewHeight = lidHeight * 2 + lidExtD + 2.5;

                        // Local functions for lid pieces (matching generateLidSVG)
                        const generateLidFrontBackPreview = (width, height) => {
                          const tabDepth = materialThickness;
                          const bottomTabCount = calculateTabCount(width);
                          const sideTabCount = calculateTabCount(height);

                          let path = `M 0 0`;
                          path += ` L ${width} 0`;

                          const rightNotches = generateTabPositions(height, sideTabCount);
                          rightNotches.forEach(notch => {
                            path += ` L ${width} ${notch.start}`;
                            path += ` L ${width - tabDepth} ${notch.start}`;
                            path += ` L ${width - tabDepth} ${notch.end}`;
                            path += ` L ${width} ${notch.end}`;
                          });
                          path += ` L ${width} ${height}`;

                          const bottomTabs = generateTabPositions(width, bottomTabCount);
                          for (let i = bottomTabs.length - 1; i >= 0; i--) {
                            const tab = bottomTabs[i];
                            path += ` L ${tab.end} ${height}`;
                            path += ` L ${tab.end} ${height + tabDepth}`;
                            path += ` L ${tab.start} ${height + tabDepth}`;
                            path += ` L ${tab.start} ${height}`;
                          }
                          path += ` L 0 ${height}`;

                          const leftNotches = generateTabPositions(height, sideTabCount);
                          for (let i = leftNotches.length - 1; i >= 0; i--) {
                            const notch = leftNotches[i];
                            path += ` L 0 ${notch.end}`;
                            path += ` L ${tabDepth} ${notch.end}`;
                            path += ` L ${tabDepth} ${notch.start}`;
                            path += ` L 0 ${notch.start}`;
                          }
                          path += ` L 0 0 Z`;
                          return path;
                        };

                        const generateLidSidePreview = (width, height) => {
                          const tabDepth = materialThickness;
                          const bottomTabCount = calculateTabCount(width);
                          const frontBackTabCount = calculateTabCount(height);

                          let path = `M 0 0`;
                          path += ` L ${width} 0`;

                          const rightTabs = generateTabPositions(height, frontBackTabCount);
                          rightTabs.forEach(tab => {
                            path += ` L ${width} ${tab.start}`;
                            path += ` L ${width + tabDepth} ${tab.start}`;
                            path += ` L ${width + tabDepth} ${tab.end}`;
                            path += ` L ${width} ${tab.end}`;
                          });
                          path += ` L ${width} ${height}`;

                          const bottomTabs = generateTabPositions(width, bottomTabCount);
                          for (let i = bottomTabs.length - 1; i >= 0; i--) {
                            const tab = bottomTabs[i];
                            path += ` L ${tab.end} ${height}`;
                            path += ` L ${tab.end} ${height + tabDepth}`;
                            path += ` L ${tab.start} ${height + tabDepth}`;
                            path += ` L ${tab.start} ${height}`;
                          }
                          path += ` L 0 ${height}`;

                          const leftTabs = generateTabPositions(height, frontBackTabCount);
                          for (let i = leftTabs.length - 1; i >= 0; i--) {
                            const tab = leftTabs[i];
                            path += ` L 0 ${tab.end}`;
                            path += ` L ${-tabDepth} ${tab.end}`;
                            path += ` L ${-tabDepth} ${tab.start}`;
                            path += ` L 0 ${tab.start}`;
                          }
                          path += ` L 0 0 Z`;
                          return path;
                        };

                        const generateLidTopPreview = (width, depth, sideWidth) => {
                          const tabDepth = materialThickness;
                          const widthNotchCount = calculateTabCount(width);
                          const depthNotchCount = calculateTabCount(sideWidth);

                          let path = `M 0 0`;

                          const topNotches = generateTabPositions(width, widthNotchCount);
                          topNotches.forEach(notch => {
                            path += ` L ${notch.start} 0`;
                            path += ` L ${notch.start} ${tabDepth}`;
                            path += ` L ${notch.end} ${tabDepth}`;
                            path += ` L ${notch.end} 0`;
                          });
                          path += ` L ${width} 0`;

                          // Distribute notches across sideWidth to match side wall tab positions
                          // Then offset by materialThickness since top is exteriorDepth but side wall body is sideWidth
                          const rightNotches = generateTabPositions(sideWidth, depthNotchCount);
                          rightNotches.forEach(notch => {
                            const offsetStart = notch.start + materialThickness;
                            const offsetEnd = notch.end + materialThickness;
                            path += ` L ${width} ${offsetStart}`;
                            path += ` L ${width - tabDepth} ${offsetStart}`;
                            path += ` L ${width - tabDepth} ${offsetEnd}`;
                            path += ` L ${width} ${offsetEnd}`;
                          });
                          path += ` L ${width} ${depth}`;

                          const bottomNotches = generateTabPositions(width, widthNotchCount);
                          for (let i = bottomNotches.length - 1; i >= 0; i--) {
                            const notch = bottomNotches[i];
                            path += ` L ${notch.end} ${depth}`;
                            path += ` L ${notch.end} ${depth - tabDepth}`;
                            path += ` L ${notch.start} ${depth - tabDepth}`;
                            path += ` L ${notch.start} ${depth}`;
                          }
                          path += ` L 0 ${depth}`;

                          // Distribute notches across sideWidth to match side wall tab positions
                          // Then offset by materialThickness
                          const leftNotches = generateTabPositions(sideWidth, depthNotchCount);
                          for (let i = leftNotches.length - 1; i >= 0; i--) {
                            const notch = leftNotches[i];
                            const offsetStart = notch.start + materialThickness;
                            const offsetEnd = notch.end + materialThickness;
                            path += ` L 0 ${offsetEnd}`;
                            path += ` L ${tabDepth} ${offsetEnd}`;
                            path += ` L ${tabDepth} ${offsetStart}`;
                            path += ` L 0 ${offsetStart}`;
                          }
                          path += ` L 0 0 Z`;
                          return path;
                        };

                        return (
                          <svg
                            width={`${previewWidth * 96 * lidZoomLevel}px`}
                            height={`${(lidHeight + lidExtD + 1.5) * 96 * lidZoomLevel}px`}
                            viewBox={`-0.5 -0.5 ${previewWidth} ${previewHeight}`}
                            style={{ background: '#f9fafb', display: 'block' }}
                          >
                            <defs>
                              <style>{`.lid-cut { stroke: #7c3aed; stroke-width: 0.02; fill: #e9d5ff; } .lid-label { fill: #666; font-family: Arial; font-size: 0.25px; }`}</style>
                            </defs>

                            {/* Back Wall (top center) - notches on sides, tabs at bottom point toward top panel */}
                            <g transform={`translate(${lidExtD + 0.25}, ${lidHeight + materialThickness + 0.5 - lidHeight - 0.25})`}>
                              <path d={generateLidFrontBackPreview(lidExtW, lidHeight)} className="lid-cut" />
                              <text className="lid-label" x={lidExtW / 2} y={-0.15} textAnchor="middle">Back</text>
                            </g>

                            {/* Middle row: Left Wall, Top, Right Wall */}
                            <g transform={`translate(0, ${lidHeight + materialThickness + 0.5})`}>
                              {/* Left wall - rotated and positioned to the left of top */}
                              {/* Center based on path body center (lidSideW/2), which equals bounding box center */}
                              <g transform={`translate(${lidExtD}, ${lidExtD / 2}) rotate(-90) translate(${-lidSideW / 2}, ${-lidHeight})`}>
                                <path d={generateLidSidePreview(lidSideW, lidHeight)} className="lid-cut" />
                                <text className="lid-label" x={lidSideW / 2} y={-0.2} textAnchor="middle">Left</text>
                              </g>

                              {/* Top panel */}
                              <g transform={`translate(${lidExtD + 0.25}, 0)`}>
                                <path d={generateLidTopPreview(lidExtW, lidExtD, lidSideW)} className="lid-cut" />
                                <text className="lid-label" x={lidExtW / 2} y={lidExtD / 2} textAnchor="middle" dominantBaseline="middle">Top</text>
                              </g>

                              {/* Right wall - rotated and positioned to the right of top */}
                              {/* Center based on path body center (lidSideW/2), which equals bounding box center */}
                              <g transform={`translate(${lidExtD + 0.5 + lidExtW + lidHeight}, ${lidExtD / 2}) rotate(90) translate(${-lidSideW / 2}, 0)`}>
                                <path d={generateLidSidePreview(lidSideW, lidHeight)} className="lid-cut" />
                                <text className="lid-label" x={lidSideW / 2} y={-0.2} textAnchor="middle">Right</text>
                              </g>
                            </g>

                            {/* Front Wall (bottom center) - rotated 180° so bottom tabs point toward top panel */}
                            <g transform={`translate(${lidExtD + 0.25 + (lidExtW / 2)}, ${lidHeight + materialThickness + 0.5 + lidExtD + lidHeight + 0.25}) rotate(180) translate(${-lidExtW / 2}, 0)`}>
                              <path d={generateLidFrontBackPreview(lidExtW, lidHeight)} className="lid-cut" />
                              <text className="lid-label" x={lidExtW / 2} y={-0.3} textAnchor="middle">Front</text>
                            </g>
                          </svg>
                        );
                      })()}
                    </div>
                    </>
                  )}
                </div>
              </div>
            </div>
          );
        };

        ReactDOM.render(<CardBoxDesigner />, document.getElementById('root'));
    </script>
</body>
</html>
