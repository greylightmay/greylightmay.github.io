    <script type="text/babel">
        const { useState, useCallback, useEffect, useMemo } = React;

        // ============================================================
        // CONSTANTS
        // ============================================================
        // displayOnly: true => no second-story floor / balcony controls (buildings can't be reached into).
        // Used for model-railroad scales and very small wargaming where minis don't go inside.
        const SCALES = {
          '32mm':  { ratio: 50,  label: '32mm Wargaming (1:50)',                 displayOnly: false },
          '28mm':  { ratio: 56,  label: '28mm Heroic Wargaming (1:56)',          displayOnly: false },
          'OO':    { ratio: 76,  label: 'OO British Model Railway (1:76)',       displayOnly: true  },
          'HO':    { ratio: 87,  label: 'HO Model Railroad (1:87)',              displayOnly: true  },
          '15mm':  { ratio: 100, label: '15mm Wargaming (1:100)',                displayOnly: false },
          'N':     { ratio: 160, label: 'N Scale / 10mm Wargaming (1:160)',      displayOnly: true  },
        };

        // Real-world architectural defaults (feet)
        const STORY_HEIGHT_FT   = 12;        // floor-to-floor (Victorian-ish for scale presence)
        const DOOR_WIDTH_FT     = 3;
        const DOOR_HEIGHT_FT    = 80 / 12;   // 6'8"
        const WINDOW_WIDTH_FT   = 3;
        const WINDOW_HEIGHT_FT  = 4;
        const SILL_HEIGHT_FT    = 3;         // floor to window sill
        const MIN_GAP_FT        = 0.5;       // 6" gap between openings/corners
        const TRIM_MARGIN_FT      = 0.25;    // 3" window trim margin around opening
        const DOOR_TRIM_MARGIN_FT = 0.5;     // 6" door casing — wider for visual weight
        const GABLE_WINDOW_FT   = 2;         // 2ft × 2ft Victorian attic window in gable peak
        const ROOF_OVERHANG_FT  = 1;         // 12" overhang past walls on all roof edges
        const WINDOW_TRIM_LIP   = 0.04;      // Cut inches — small lip on inner edge of window trim
        const MIN_TRIM_MARGIN   = 0.04;      // Cut inches — floor for window trim wing (~1mm minimum)
                                              // so trim stays handleable and visible past the opening
                                              // at small scales (N gable windows especially).
        const WINDOW_SILL_REVEAL = 0.02;     // Cut inches — visible ring of wall material inside
                                              // the trim's inner cutout, before the actual wall hole.
                                              // Reads as a painted sill/jamb in a contrasting color
                                              // from the trim. Only applies to the single-cut fallback
                                              // (small scales like N where mullions can't be cut);
                                              // the 4-pane case shows the mullion frame itself as
                                              // the visible "interior" around the panes.

        const ROOF_PITCHES = [
          { value: 30, label: '30° (Shallow)' },
          { value: 45, label: '45° (Classic)' },
          { value: 60, label: '60° (Steep)' },
        ];

        // ============================================================
        // RUIN CONSTANTS (v2.0) — see specs/scale-model-building-designer-v2.md
        // ============================================================
        const RUIN_STYLE_LABELS = {
          intact:    'Intact',
          collapsed: 'Collapsed top',
          corner:    'Blown corner',
          breach:    'Breached',
        };
        // Default per-wall styles applied when the building is first switched to Ruined
        const RUIN_DEFAULT_STYLES = { front: 'breach', back: 'collapsed', left: 'collapsed', right: 'corner' };

        // Cuttability floors (cut inches)
        const RUIN_MIN_SEG       = 0.04;  // ~1mm — smallest jag step the laser cuts cleanly
        const RUIN_MIN_CORNER    = 0.5;   // minimum surviving corner stub height
        const TAB_BREAKPOINT     = 1.25;  // joinery segments shorter than this use small tabs
        const TAB_WIDTH_STD      = 0.5;
        const TAB_WIDTH_SMALL    = 0.25;

        // Real-world masonry texture for break profiles (feet)
        const RUIN_COURSE_FT     = 8 / 12;  // 8" brick/block course height
        const RUIN_RUN_MIN_FT    = 1.0;     // shortest horizontal run in a break profile
        const RUIN_RUN_MAX_FT    = 2.5;     // longest horizontal run

        // Damage-level parameter bands. Heights are fractions of total wall height.
        const DAMAGE_PARAMS = {
          light:  { cornerBand: [0.70, 0.95], blownBand: [0.40, 0.60], keptBand: [0.85, 1.00], sag: 0.10, breachW: [0.20, 0.32], breachH: [0.35, 0.50] },
          medium: { cornerBand: [0.45, 0.80], blownBand: [0.22, 0.42], keptBand: [0.80, 1.00], sag: 0.18, breachW: [0.28, 0.42], breachH: [0.45, 0.62] },
          heavy:  { cornerBand: [0.28, 0.58], blownBand: [0.10, 0.28], keptBand: [0.70, 0.95], sag: 0.28, breachW: [0.38, 0.55], breachH: [0.55, 0.75] },
        };

        // Seeded PRNG (mulberry32) — ruins must be deterministic so the preview,
        // bed-fit check, and downloaded SVG always show the same building.
        const mulberry32 = (seed) => {
          let a = seed >>> 0;
          return () => {
            a |= 0; a = (a + 0x6D2B79F5) | 0;
            let t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        };

        // Each wall's left/right edge maps to a shared building corner so both
        // adjacent walls agree on one surviving height per corner (corner-first rule).
        //
        // The pairing follows the cross-layout FOLD (the same assembly the preview
        // shows): floor flat, walls fold up around their floor edge. Under that fold,
        // in path coordinates (x=0 = path-left):
        //   back  : path-left = NW corner, path-right = NE
        //   left  : path-left = SW,        path-right = NW
        //   right : path-left = NE,        path-right = SE
        //   front : path-left = SE,        path-right = SW   (front is rotated 180 in the fold)
        // So the mating pairs are: NW = back.left + left.right, NE = back.right + right.left,
        // SW = front.right + left.left, SE = front.left + right.right.
        // Getting this table wrong makes the two walls at a corner disagree on the
        // surviving height — mismatched tab counts, positions, and widths.
        const WALL_CORNERS = {
          front: { left: 'SE', right: 'SW' },
          back:  { left: 'NW', right: 'NE' },
          left:  { left: 'SW', right: 'NW' },
          right: { left: 'NE', right: 'SE' },
        };
        const CORNER_KEYS = ['NW', 'NE', 'SW', 'SE'];

        // ============================================================
        // RUIN GEOMETRY HELPERS (pure functions, body coordinates,
        // y measured DOWN from the panel top)
        // ============================================================

        // Jagged break profile: a random walk quantized to the masonry course grid,
        // stepping between the two surviving corner heights with a sag toward the middle.
        // Returns rectilinear points [{x,y}...] from (0, yLeft) to (L, yRight).
        const buildBreakProfile = (rng, L, yLeft, yRight, totalH, sagFrac, courseH, runMin, runMax, maxY) => {
          // The walk stays on a course grid anchored at yLeft. Corner heights are
          // pre-quantized to the same grid, so every step — including the final
          // landing at the right corner — is either zero or a full course, never
          // a sub-minimum sliver.
          const minYg = yLeft - Math.floor(yLeft / courseH) * courseH;          // highest grid value ≥ 0
          const maxYg = yLeft + Math.floor((maxY - yLeft) / courseH) * courseH; // lowest grid value ≤ maxY
          const pts = [{ x: 0, y: yLeft }];
          let x = 0, y = yLeft;
          while (true) {
            const run = runMin + rng() * (runMax - runMin);
            if (x + run >= L - runMin * 0.6) {
              // Final stretch: land on the right corner height with a normal sideways-
              // then-down jag at the current boundary, then run out to the corner.
              // NEVER patch the height with a vertical at x = L itself — that would
              // make the laser cut up and retrace back down the corner edge line.
              if (Math.abs(y - yRight) > 1e-9) {
                if (x <= 1e-9) { x = Math.min(runMin, L / 2); pts.push({ x, y }); }
                pts.push({ x, y: yRight });
                y = yRight;
              }
              pts.push({ x: L, y });
              break;
            }
            x += run;
            pts.push({ x, y });
            const t = x / L;
            const target = yLeft + (yRight - yLeft) * t + sagFrac * totalH * Math.sin(Math.PI * t);
            let steps = Math.round((target - y) / courseH + (rng() * 2 - 1) * 1.2);
            if (steps === 0) steps = rng() < 0.5 ? -1 : 1;
            const newY = Math.min(Math.max(y + steps * courseH, minYg), maxYg);
            if (Math.abs(newY - y) >= courseH * 0.5) {
              y = newY;
              pts.push({ x, y });
            }
          }
          return pts;
        };

        // Remove zero-width spikes from a polyline: consecutive duplicate points and
        // 180° reversals (the cut going out and retracing back over the same line).
        // Retraces leave no gap in the finished piece but double-cut the material.
        const sanitizePts = (ptsIn) => {
          const pts = [];
          for (const p of ptsIn) {
            pts.push({ x: p.x, y: p.y });
            let reduced = true;
            while (reduced && pts.length >= 2) {
              reduced = false;
              const n = pts.length;
              const c = pts[n - 1], b = pts[n - 2];
              if (Math.abs(c.x - b.x) < 1e-9 && Math.abs(c.y - b.y) < 1e-9) {
                pts.splice(n - 1, 1);   // duplicate point
                reduced = true;
                continue;
              }
              if (n >= 3) {
                const a = pts[n - 3];
                const d1x = b.x - a.x, d1y = b.y - a.y, d2x = c.x - b.x, d2y = c.y - b.y;
                const cross = d1x * d2y - d1y * d2x;
                const dot = d1x * d2x + d1y * d2y;
                if (Math.abs(cross) < 1e-12 && dot < 0) {
                  pts.splice(n - 2, 1); // spike tip — path goes a→c directly
                  reduced = true;
                }
              }
            }
          }
          return pts;
        };

        // Merge adjacent profile runs whose height difference is below the cuttable
        // minimum (these appear where an absorbed opening's bottom lands a hair away
        // from a course line). Inner runs snap to the DEEPER neighbor; the first and
        // last runs are corner anchors and never move.
        const smoothRuns = (runsIn, minSeg) => {
          let runs = runsIn.map(r => ({ ...r }));
          let changed = true;
          while (changed) {
            changed = false;
            for (let i = 0; i < runs.length - 1; i++) {
              const a = runs[i], b = runs[i + 1];
              const dy = Math.abs(a.y - b.y);
              if (dy > 1e-9 && dy < minSeg) {
                const aAnchor = i === 0, bAnchor = i + 1 === runs.length - 1;
                if (aAnchor && bAnchor) continue;
                const y = aAnchor ? a.y : bAnchor ? b.y : Math.max(a.y, b.y);
                a.y = y; b.y = y;
                changed = true;
              }
            }
            const merged = [];
            for (const r of runs) {
              const prev = merged[merged.length - 1];
              if (prev && Math.abs(prev.y - r.y) < 1e-9) prev.x1 = r.x1;
              else merged.push({ ...r });
            }
            runs = merged;
          }
          return runs;
        };

        // Profile <-> horizontal-run conversions. A profile is strictly alternating
        // horizontal/vertical segments, so it is fully described by its horizontal runs.
        const profileToRuns = (pts) => {
          const runs = [];
          for (let i = 1; i < pts.length; i++) {
            const a = pts[i - 1], b = pts[i];
            if (b.x > a.x + 1e-9) runs.push({ x0: a.x, x1: b.x, y: a.y });
          }
          return runs;
        };
        const runsToPts = (runs) => {
          const pts = [{ x: runs[0].x0, y: runs[0].y }];
          for (let i = 0; i < runs.length; i++) {
            pts.push({ x: runs[i].x1, y: runs[i].y });
            if (i + 1 < runs.length && Math.abs(runs[i + 1].y - runs[i].y) > 1e-9) {
              pts.push({ x: runs[i].x1, y: runs[i + 1].y });
            }
          }
          return pts;
        };

        // Lowest/highest break point over an x-range (used to classify openings)
        const rangeMinMaxY = (runs, l, r) => {
          let mn = Infinity, mx = -Infinity;
          for (const run of runs) {
            if (run.x1 <= l || run.x0 >= r) continue;
            mn = Math.min(mn, run.y);
            mx = Math.max(mx, run.y);
          }
          return { mn, mx };
        };

        // Absorb an opening into the break silhouette: within [l, r] the profile is
        // pushed down to at least floorY (the opening's bottom), turning a half-destroyed
        // window/door into a bite in the silhouette. Slivers shorter than minSeg are
        // merged into the LOWER neighbor (removing material is always safe; adding it
        // back could violate web rules).
        const absorbIntoRuns = (runs, l, r, floorY, minSeg) => {
          const out = [];
          for (const run of runs) {
            if (run.x1 <= l || run.x0 >= r || run.y >= floorY - 1e-9) { out.push({ ...run }); continue; }
            if (run.x0 < l) out.push({ x0: run.x0, x1: l, y: run.y });
            out.push({ x0: Math.max(run.x0, l), x1: Math.min(run.x1, r), y: floorY });
            if (run.x1 > r) out.push({ x0: r, x1: run.x1, y: run.y });
          }
          const clean = [];
          for (let i = 0; i < out.length; i++) {
            const run = out[i];
            const prev = clean[clean.length - 1];
            // First/last runs are corner anchors — never merge them away, or the
            // profile endpoint drifts off the shared corner height.
            const isAnchor = i === 0 || i === out.length - 1;
            if (!isAnchor && run.x1 - run.x0 < minSeg && (prev || i + 1 < out.length)) {
              const next = out[i + 1];
              if (prev && (!next || prev.y >= next.y)) { prev.x1 = run.x1; }
              else if (next) { next.x0 = run.x0; }
              continue;
            }
            if (prev && Math.abs(prev.y - run.y) < 1e-9) prev.x1 = run.x1;
            else clean.push(run);
          }
          return clean;
        };

        // Jagged rectangular hole for breaches. Jitter is INWARD only (the hole edge
        // never moves past the placement rect), so web margins guaranteed at placement
        // time can never be violated by the jagging. Corners stay pinned.
        const buildJaggedRect = (rng, l, t, r, b, courseH, runMin, runMax) => {
          const w = r - l, h = b - t;
          if (w < runMin * 1.5 || h < runMin * 1.5) {
            return `M ${l} ${t} L ${r} ${t} L ${r} ${b} L ${l} ${b} Z`;
          }
          const maxOff = Math.min(2 * courseH, w / 4, h / 4);
          const offsets = [0, Math.min(courseH, maxOff), Math.min(2 * courseH, maxOff)];
          const breakpoints = (len) => {
            const bps = [];
            let x = 0;
            while (x < len - runMin * 0.5) {
              x += runMin + rng() * (runMax - runMin);
              if (x > len - runMin * 0.5) x = len;
              bps.push(x);
            }
            if (!bps.length || bps[bps.length - 1] < len) bps.push(len);
            return bps;
          };
          const pts = [{ x: l, y: t }];
          // Jags must stay clear of both corners of their edge by at least the maximum
          // jag depth (+ margin). Otherwise this edge's inward jag and the ADJACENT
          // edge's inward jag can cross near the corner, pinching off a loose
          // "missing brick" of material diagonal to the hole corner.
          const cornerClear = maxOff + RUIN_MIN_SEG;
          const jaggedEdge = (sx, sy, dx, dy, len, inX, inY) => {
            let off = 0;
            const bps = breakpoints(len);
            for (let i = 0; i < bps.length; i++) {
              const p = bps[i];
              pts.push({ x: sx + dx * p + inX * off, y: sy + dy * p + inY * off });
              if (i >= bps.length - 1) break;
              // The offset chosen here applies to the run [bps[i], bps[i+1]].
              // Force 0 in the corner-clear zones and for the final run into the
              // corner (so the path arrives traveling ALONG the edge — a hop at the
              // corner itself would lie on the next edge's line and get retraced).
              const inClearZone = p < cornerClear || bps[i + 1] > len - cornerClear;
              const newOff = (i >= bps.length - 2 || inClearZone) ? 0 : offsets[Math.floor(rng() * offsets.length)];
              if (Math.abs(newOff - off) > 1e-9) {
                pts.push({ x: sx + dx * p + inX * newOff, y: sy + dy * p + inY * newOff });
                off = newOff;
              }
            }
          };
          jaggedEdge(l, t, 1, 0, w, 0, 1);     // top edge, inward = down
          jaggedEdge(r, t, 0, 1, h, -1, 0);    // right edge, inward = left
          jaggedEdge(r, b, -1, 0, w, 0, -1);   // bottom edge, inward = up
          jaggedEdge(l, b, 0, -1, h, 1, 0);    // left edge, inward = right
          const clean = sanitizePts(pts);
          if (clean.length > 1 && Math.abs(clean[0].x - clean[clean.length - 1].x) < 1e-9 && Math.abs(clean[0].y - clean[clean.length - 1].y) < 1e-9) {
            clean.pop(); // Z closes back to the start; no duplicate point needed
          }
          return 'M ' + clean.map(p => `${p.x} ${p.y}`).join(' L ') + ' Z';
        };


        const WALL_KEYS = ['front', 'back', 'left', 'right'];
        const WALL_LABELS = { front: 'Front', back: 'Back', left: 'Left', right: 'Right' };

        const BuildingDesigner = () => {
          // ====================================================
          // STATE
          // ====================================================
          // Scale & footprint (footprint is in REAL-WORLD FEET)
          const [scale, setScale] = useState('28mm');
          const [footprintWidthFt, setFootprintWidthFt] = useState(40);
          const [footprintDepthFt, setFootprintDepthFt] = useState(20);
          const [footprintWidthInput, setFootprintWidthInput] = useState('40');
          const [footprintDepthInput, setFootprintDepthInput] = useState('20');
          const [stories, setStories] = useState(1);

          // Roof
          const [roofPitch, setRoofPitch] = useState(45);
          const [ridgeDirection, setRidgeDirection] = useState('width'); // 'width' or 'depth'

          // Floor / balcony
          const [includeFloor, setIncludeFloor] = useState(false);
          const [secondFloorMode, setSecondFloorMode] = useState('none'); // 'none'|'balcony'
          const [balconyWidth, setBalconyWidth] = useState(1.0);
          const [balconyWidthInput, setBalconyWidthInput] = useState('1.0');

          // Per-wall config: { [story]: { [wall]: { door, windows } } }
          const [wallConfig, setWallConfig] = useState({
            1: {
              front: { door: 'center', windows: 2 },
              back:  { door: 'none',   windows: 2 },
              left:  { door: 'none',   windows: 1 },
              right: { door: 'none',   windows: 1 },
            },
            2: {
              front: { door: 'none',   windows: 2 },
              back:  { door: 'none',   windows: 2 },
              left:  { door: 'none',   windows: 1 },
              right: { door: 'none',   windows: 1 },
            },
          });

          // Door clearance (floating panel gap)
          const [doorClearance, setDoorClearance] = useState(0.03);
          const [doorClearanceInput, setDoorClearanceInput] = useState('0.03');

          // Ruins (v2.0) — wargaming scales only
          const [condition, setCondition] = useState('intact');       // 'intact' | 'ruined'
          const [damageLevel, setDamageLevel] = useState('medium');   // 'light' | 'medium' | 'heavy'
          const [ruinSeed, setRuinSeed] = useState(1);
          const [ruinSeedInput, setRuinSeedInput] = useState('1');
          const [ruinStyles, setRuinStyles] = useState({ ...RUIN_DEFAULT_STYLES });
          const [includeRuinRoof, setIncludeRuinRoof] = useState(false);

          // Gable windows — one per wall (only applies to walls currently gable-ended)
          const [gableWindows, setGableWindows] = useState({ front: false, back: false, left: false, right: false });

          // Material & units
          const [units, setUnits] = useState('inches');
          const [materialThickness, setMaterialThickness] = useState(0.125);
          const [materialPreset, setMaterialPreset] = useState('0.125');
          const [customThickness, setCustomThickness] = useState('');

          // Bed check
          const [bedSize, setBedSize] = useState({ width: 12, height: 20 });
          const [bedPreset, setBedPreset] = useState('12x20');
          const [customBedWidth, setCustomBedWidth] = useState('');
          const [customBedHeight, setCustomBedHeight] = useState('');

          // Preview
          const [zoomLevel, setZoomLevel] = useState(0.5);

          // Filename
          const [filename, setFilename] = useState('building');

          // ====================================================
          // UNIT CONVERSION
          // ====================================================
          const convertToInches = (value) => units === 'mm' ? value / 25.4 : value;
          const convertFromInches = (value) => units === 'mm' ? value * 25.4 : value;
          const formatUnit = (value) => units === 'mm' ? value.toFixed(1) : value.toFixed(3);

          useEffect(() => {
            setBalconyWidthInput(formatUnit(convertFromInches(balconyWidth)));
            setDoorClearanceInput(formatUnit(convertFromInches(doorClearance)));
          }, [units]);

          useEffect(() => {
            if (materialPreset === 'custom') return;
            const presets = units === 'inches'
              ? { '0.0625': 0.0625, '0.0787': 0.0787, '0.125': 0.125, '0.118': 0.118, '0.25': 0.25, '0.236': 0.236 }
              : { '1.5875': 1.5875 / 25.4, '2.0': 2.0 / 25.4, '3.0': 3.0 / 25.4, '3.175': 3.175 / 25.4, '6.0': 6.0 / 25.4, '6.35': 6.35 / 25.4 };
            setMaterialThickness(presets[materialPreset] || 0.125);
          }, [materialPreset, units]);

          // Display-only scales (trains, very small wargaming) don't need a second-story floor or
          // balcony — no miniatures going inside. Auto-reset to 'none' when scale becomes display-only.
          // Ruins are a wargaming feature, so they reset too.
          useEffect(() => {
            if (SCALES[scale].displayOnly && secondFloorMode !== 'none') setSecondFloorMode('none');
            if (SCALES[scale].displayOnly && condition !== 'intact') setCondition('intact');
          }, [scale]);

          // When ridge direction changes, clear gable-window flags on walls that are no longer gable.
          // Prevents stale "enabled but not a gable wall" warnings after a logical reconfigure.
          useEffect(() => {
            const ridgeAlongWidth = ridgeDirection === 'width';
            const isGable = wk => ridgeAlongWidth
              ? (wk === 'left' || wk === 'right')
              : (wk === 'front' || wk === 'back');
            setGableWindows(prev => {
              const next = { ...prev };
              let changed = false;
              for (const wk of WALL_KEYS) {
                if (next[wk] && !isGable(wk)) { next[wk] = false; changed = true; }
              }
              return changed ? next : prev;
            });
          }, [ridgeDirection]);

          // ====================================================
          // SCALE MATH — convert real-world feet to cut inches
          // ====================================================
          const scaled = useMemo(() => {
            const ratio = SCALES[scale].ratio;
            const sf = (ft) => (ft * 12) / ratio; // feet -> cut inches
            return {
              ratio,
              footprintWidth:  sf(footprintWidthFt),
              footprintDepth:  sf(footprintDepthFt),
              storyHeight:     sf(STORY_HEIGHT_FT),
              doorWidth:       sf(DOOR_WIDTH_FT),
              doorHeight:      sf(DOOR_HEIGHT_FT),
              windowWidth:     sf(WINDOW_WIDTH_FT),
              windowHeight:    sf(WINDOW_HEIGHT_FT),
              sillHeight:      sf(SILL_HEIGHT_FT),
              minGap:          sf(MIN_GAP_FT),
              trimMargin:      sf(TRIM_MARGIN_FT),
              doorTrimMargin:  sf(DOOR_TRIM_MARGIN_FT),
              gableWindowSize: sf(GABLE_WINDOW_FT),
              roofOverhang:    sf(ROOF_OVERHANG_FT),
            };
          }, [scale, footprintWidthFt, footprintDepthFt]);

          // Total wall height (includes all stories, no gable triangle)
          const wallBodyHeight = scaled.storyHeight * stories;
          const totalWallH = wallBodyHeight; // alias used by the ruin plan / wall pieces (v2.0)

          // Gable peak height above eave = (ridgeSpan/2) * tan(pitch)
          const pitchRad = (roofPitch * Math.PI) / 180;
          const ridgeSpanFt = ridgeDirection === 'width' ? footprintDepthFt : footprintWidthFt;
          const gablePeakCut = (SCALES[scale].ratio ? ((ridgeSpanFt * 12) / SCALES[scale].ratio) : 0) / 2 * Math.tan(pitchRad);

          // ====================================================
          // PATH PRIMITIVES (copied from 5-sided-box-designer-v2)
          // ====================================================
          const calculateTabCount = (edgeLength) => Math.max(1, Math.ceil(edgeLength / 2));

          // Adaptive tab width (v2.0): short joinery segments get small tabs so there's
          // still a shoulder on each side. Both pieces of a mating pair derive width from
          // the SAME segment length, so tab/notch alignment is preserved automatically.
          const tabWidthFor = (segmentLength) =>
            segmentLength < TAB_BREAKPOINT ? TAB_WIDTH_SMALL : TAB_WIDTH_STD;

          const generateTabPositions = (edgeLength, numTabs, tabWidth) => {
            if (!tabWidth) tabWidth = 0.5;
            const spacing = edgeLength / numTabs;
            const positions = [];
            for (let i = 0; i < numTabs; i++) {
              const center = (i + 0.5) * spacing;
              positions.push({ start: center - tabWidth / 2, end: center + tabWidth / 2 });
            }
            return positions;
          };

          // ====================================================
          // OPENING LAYOUT
          // Windows sit at fixed fractional positions (0.25, 0.5, 0.75) so they align
          // across opposing walls regardless of door placement.
          // Doors sit at 0.25 / 0.5 / 0.75 for left/center/right.
          // Door base is raised by materialThickness so the wall's bottom strip remains
          // intact (needed for bottom tabs to stay attached).
          // ====================================================
          const computeWallLayout = (wallLength, story, config) => {
            const { doorWidth, doorHeight, windowWidth, windowHeight, sillHeight, storyHeight, minGap } = scaled;
            const storyOffset = (story - 1) * storyHeight;
            const doorBaseY = storyOffset + materialThickness; // raised so tab strip remains
            const sillY = storyOffset + sillHeight;

            const windowAt = (frac) => ({
              type: 'window', width: windowWidth, height: windowHeight,
              leftX: frac * wallLength - windowWidth / 2,
              bottomY: sillY
            });
            const doorAt = (frac) => ({
              type: 'door', width: doorWidth, height: doorHeight,
              leftX: frac * wallLength - doorWidth / 2,
              bottomY: doorBaseY
            });

            const d = config.door;
            const w = config.windows;
            const hasDoor = d !== 'none';
            const doorFrac = d === 'left' ? 0.25 : d === 'right' ? 0.75 : 0.5;

            const openings = [];
            if (!hasDoor) {
              if (w >= 1) openings.push(windowAt(w === 1 ? 0.5 : 0.25));
              if (w >= 2) openings.push(windowAt(w === 2 ? 0.75 : 0.5));
              if (w >= 3) openings.push(windowAt(0.75));
            } else {
              openings.push(doorAt(doorFrac));
              // Window slots other than the one occupied by door
              if (w === 1) {
                // Put window on opposite side of door; for center door, default to 0.25
                const wFrac = d === 'left' ? 0.75 : d === 'right' ? 0.25 : 0.25;
                openings.push(windowAt(wFrac));
              } else if (w === 2) {
                // Keep 2 windows at fixed 0.25 and 0.75; if door occupies one of these, shift
                if (doorFrac === 0.5) {
                  openings.push(windowAt(0.25));
                  openings.push(windowAt(0.75));
                } else if (doorFrac === 0.25) {
                  openings.push(windowAt(0.5));
                  openings.push(windowAt(0.75));
                } else {
                  openings.push(windowAt(0.25));
                  openings.push(windowAt(0.5));
                }
              } else if (w === 3) {
                // 3 windows + door not supported — add windows at non-door slots
                [0.25, 0.5, 0.75].filter(f => f !== doorFrac).forEach(f => openings.push(windowAt(f)));
              }
            }

            // Validation: required horizontal span (sum widths + minGap padding between)
            const sorted = [...openings].sort((a, b) => a.leftX - b.leftX);
            let overflow = false;
            if (sorted.length > 0) {
              if (sorted[0].leftX < minGap - 0.001) overflow = true;
              for (let i = 1; i < sorted.length; i++) {
                const prevEnd = sorted[i-1].leftX + sorted[i-1].width;
                if (sorted[i].leftX < prevEnd + minGap - 0.001) overflow = true;
              }
              const last = sorted[sorted.length - 1];
              if (last.leftX + last.width > wallLength - minGap + 0.001) overflow = true;
            }
            const requiredLength = wallLength; // best-effort; used in the warning message

            return { openings, overflow, requiredLength };
          };

          // ====================================================
          // WALL PANEL PATH GENERATION
          // ====================================================
          // Generates a wall panel path (clockwise from top-left) with:
          //  - tabs/notches on sides (cornerMode)
          //  - tab on bottom (bottom: 'tabs'|'notches'|'none')
          //  - top edge: flat ('flat'), angled-for-eave ('eaveAngle'), or gable triangle ('gable')
          //  - rectangular cutouts for openings
          //  - optional horizontal slot line across interior (balcony slots) at slotY
          //
          // Coordinates: x=0..wallLength, y=0 at TOP, y=panelHeight at BOTTOM
          // For simplicity, we'll build the outline in one go, then add opening cutouts as separate sub-paths.
          const generateWallPanelPath = (params) => {
            const {
              wallLength,          // body length (interior corner-to-corner for gable walls, similar for eave)
              panelHeight,         // body height (wall height, NOT including gable peak if gable)
              leftEdge,            // 'tabs' | 'notches' | 'plain'
              rightEdge,           // 'tabs' | 'notches' | 'plain'
              bottomEdge,          // 'tabs' | 'notches' | 'plain'
              topEdge,             // { type: 'flat' } | { type: 'gable', peakHeight } | { type: 'ruin', profile: [{x,y}...] }
              openings = [],       // [{leftX, bottomY, width, height}]  bottomY measured from panel bottom upward
            } = params;

            // Joinery heights (v2.0 ruins): corner tabs/notches occupy only the bottom
            // `joinH` of each side edge. Both walls sharing a corner are given the same
            // joinH (the corner's surviving height), so mating pairs always align and
            // every standing corner keeps at least one locking tab. Defaults to full height.
            const leftJoinH  = params.leftJoinH  != null ? params.leftJoinH  : panelHeight;
            const rightJoinH = params.rightJoinH != null ? params.rightJoinH : panelHeight;

            const tabDepth = materialThickness;

            // Tab positions for a side edge: re-spaced across the surviving segment,
            // measured down from the panel top (offset = panelHeight - joinH).
            const sideTabsFor = (joinH) => {
              const tw = tabWidthFor(joinH);
              const offset = panelHeight - joinH;
              return generateTabPositions(joinH, calculateTabCount(joinH), tw)
                .map(t => ({ start: t.start + offset, end: t.end + offset }));
            };

            // --- Build outline ---
            let outline = '';
            // Where the top edge meets each side edge (0 for full-height walls;
            // lower for ruined break profiles that start at the surviving corner height)
            const topLeftY  = topEdge.type === 'ruin' ? panelHeight - leftJoinH  : 0;
            const topRightY = topEdge.type === 'ruin' ? panelHeight - rightJoinH : 0;

            // Top edge: varies by type
            if (topEdge.type === 'gable') {
              // Gable wall: top comes to a peak at the horizontal center, rising peakHeight above panel top
              const peak = topEdge.peakHeight;
              outline = `M 0 0 L ${wallLength / 2} ${-peak} L ${wallLength} 0`;
            } else if (topEdge.type === 'ruin') {
              // Jagged break profile (already rectilinear, body coords, endpoints at the
              // surviving corner heights). Produced by computeRuinPlan. Sanitized with the
              // corner anchors included so no retrace can survive to the cut file.
              const pts = sanitizePts([
                { x: 0, y: topLeftY },
                ...topEdge.profile,
                { x: wallLength, y: topRightY },
              ]);
              outline = `M ${pts[0].x} ${pts[0].y}`;
              for (let i = 1; i < pts.length; i++) {
                outline += ` L ${pts[i].x} ${pts[i].y}`;
              }
            } else {
              // 'flat' / 'eaveAngle' (eave wall top stays flat — the ROOF carries the angle)
              outline = `M 0 0 L ${wallLength} 0`;
            }

            // Right edge — tabs/notches only within the surviving joinery segment
            const rightTabs = sideTabsFor(rightJoinH);
            if (rightEdge === 'tabs') {
              rightTabs.forEach(t => {
                outline += ` L ${wallLength} ${t.start} L ${wallLength + tabDepth} ${t.start} L ${wallLength + tabDepth} ${t.end} L ${wallLength} ${t.end}`;
              });
            } else if (rightEdge === 'notches') {
              rightTabs.forEach(t => {
                outline += ` L ${wallLength} ${t.start} L ${wallLength - tabDepth} ${t.start} L ${wallLength - tabDepth} ${t.end} L ${wallLength} ${t.end}`;
              });
            }
            outline += ` L ${wallLength} ${panelHeight}`;

            // Bottom edge
            // If bottomDistributeAcross is provided, distribute tab positions across that width
            // and offset into the body's local frame. Used so tabs on interior-width bodies
            // (width walls) align with floor notches spaced across exterior width.
            const bottomDistr = params.bottomDistributeAcross || wallLength;
            const bottomXOffset = (bottomDistr - wallLength) / 2;
            const bottomTabCount = calculateTabCount(bottomDistr);
            const bottomTabsRaw = generateTabPositions(bottomDistr, bottomTabCount, tabWidthFor(bottomDistr));
            const bottomTabs = bottomTabsRaw.map(t => ({ start: t.start - bottomXOffset, end: t.end - bottomXOffset }));

            if (bottomEdge === 'tabs') {
              for (let i = bottomTabs.length - 1; i >= 0; i--) {
                const t = bottomTabs[i];
                outline += ` L ${t.end} ${panelHeight} L ${t.end} ${panelHeight + tabDepth} L ${t.start} ${panelHeight + tabDepth} L ${t.start} ${panelHeight}`;
              }
            } else if (bottomEdge === 'notches') {
              for (let i = bottomTabs.length - 1; i >= 0; i--) {
                const t = bottomTabs[i];
                outline += ` L ${t.end} ${panelHeight} L ${t.end} ${panelHeight - tabDepth} L ${t.start} ${panelHeight - tabDepth} L ${t.start} ${panelHeight}`;
              }
            }
            outline += ` L 0 ${panelHeight}`;

            // Left edge (going up) — same joinery-segment rule as the right edge
            const leftTabs = sideTabsFor(leftJoinH);
            if (leftEdge === 'tabs') {
              for (let i = leftTabs.length - 1; i >= 0; i--) {
                const t = leftTabs[i];
                outline += ` L 0 ${t.end} L ${-tabDepth} ${t.end} L ${-tabDepth} ${t.start} L 0 ${t.start}`;
              }
            } else if (leftEdge === 'notches') {
              for (let i = leftTabs.length - 1; i >= 0; i--) {
                const t = leftTabs[i];
                outline += ` L 0 ${t.end} L ${tabDepth} ${t.end} L ${tabDepth} ${t.start} L 0 ${t.start}`;
              }
            }
            outline += ` L 0 ${topLeftY} Z`;

            // --- Add openings as separate sub-paths ---
            // Windows are subdivided into 4 separate pane cuts so the mullion cross stays as
            // solid wall material (the wall "owns" the mullion). If the mullion would be too
            // thin to cut reliably at the current scale, we fall back to a single rectangular
            // opening — and we deliberately make that opening SMALLER than the trim's inner
            // cutout, leaving a visible ring of wall material (the sill/jamb) inside the trim.
            // That ring gives the trim significant glue overlap AND can be painted in a
            // contrasting color from the trim for window-frame realism.
            // Doors and slots are always single rectangles at the full opening size.
            const MIN_MULLION = 0.020;  // ~0.5mm — typical laser kerf floor
            const MIN_PANE    = 0.025;  // smallest pane dim that's worth cutting

            const rect = (x, y, w, h) =>
              `M ${x} ${y} L ${x + w} ${y} L ${x + w} ${y + h} L ${x} ${y + h} Z`;

            const openingPaths = [];
            for (const op of openings) {
              const top = panelHeight - op.bottomY - op.height;
              const left = op.leftX;
              const isWindow = op.type === 'window' || op.type === 'gable-window';
              if (isWindow) {
                const m = Math.min(op.width, op.height) * 0.08;
                const qw = (op.width  - 3 * m) / 2;
                const qh = (op.height - 3 * m) / 2;
                if (m >= MIN_MULLION && qw >= MIN_PANE && qh >= MIN_PANE) {
                  // 4 separate pane cuts; mullion cross is intact wall material
                  openingPaths.push(rect(left + m,           top + m,           qw, qh)); // TL
                  openingPaths.push(rect(left + m + qw + m,  top + m,           qw, qh)); // TR
                  openingPaths.push(rect(left + m,           top + m + qh + m,  qw, qh)); // BL
                  openingPaths.push(rect(left + m + qw + m,  top + m + qh + m,  qw, qh)); // BR
                  continue;
                }
                // Fallback: cut a SMALLER rectangle centered in the opening, leaving a
                // visible wall sill inside the trim's inner cutout.
                // Trim inner cutout = opening - 2*lip (matching generateWindowTrimPath).
                // Wall cut = trim inner cutout - 2*sill reveal. Clamped to a minimum so we
                // never produce a hole smaller than ~1.5mm at extreme scales.
                const trimInnerW = Math.max(op.width  * 0.6, op.width  - 2 * WINDOW_TRIM_LIP);
                const trimInnerH = Math.max(op.height * 0.6, op.height - 2 * WINDOW_TRIM_LIP);
                const cutW = Math.max(0.06, trimInnerW - 2 * WINDOW_SILL_REVEAL);
                const cutH = Math.max(0.06, trimInnerH - 2 * WINDOW_SILL_REVEAL);
                const cutLeft = left + (op.width  - cutW) / 2;
                const cutTop  = top  + (op.height - cutH) / 2;
                openingPaths.push(rect(cutLeft, cutTop, cutW, cutH));
                continue;
              }
              openingPaths.push(rect(left, top, op.width, op.height));
            }

            return { outline, openingPaths };
          };

          // Roof slope panel (simple rectangle for v1)
          const generateRoofSlopePath = (length, slopeWidth) => {
            return `M 0 0 L ${length} 0 L ${length} ${slopeWidth} L 0 ${slopeWidth} Z`;
          };

          // Floor panel with notches on all edges to receive wall tabs
          const generateFloorPath = (width, depth, widthTabs, depthTabs) => {
            const tabDepth = materialThickness;

            // Tab width derived from the same dimension the mating wall uses, so the
            // adaptive-width rule can never desynchronize notches from wall tabs.
            const topNotches = generateTabPositions(width, widthTabs, tabWidthFor(width));
            const rightNotches = generateTabPositions(depth, depthTabs, tabWidthFor(depth));
            const bottomNotches = generateTabPositions(width, widthTabs, tabWidthFor(width));
            const leftNotches = generateTabPositions(depth, depthTabs, tabWidthFor(depth));

            let path = `M 0 0`;
            topNotches.forEach(n => {
              path += ` L ${n.start} 0 L ${n.start} ${tabDepth} L ${n.end} ${tabDepth} L ${n.end} 0`;
            });
            path += ` L ${width} 0`;
            rightNotches.forEach(n => {
              path += ` L ${width} ${n.start} L ${width - tabDepth} ${n.start} L ${width - tabDepth} ${n.end} L ${width} ${n.end}`;
            });
            path += ` L ${width} ${depth}`;
            for (let i = bottomNotches.length - 1; i >= 0; i--) {
              const n = bottomNotches[i];
              path += ` L ${n.end} ${depth} L ${n.end} ${depth - tabDepth} L ${n.start} ${depth - tabDepth} L ${n.start} ${depth}`;
            }
            path += ` L 0 ${depth}`;
            for (let i = leftNotches.length - 1; i >= 0; i--) {
              const n = leftNotches[i];
              path += ` L 0 ${n.end} L ${tabDepth} ${n.end} L ${tabDepth} ${n.start} L 0 ${n.start}`;
            }
            path += ` L 0 0 Z`;
            return path;
          };

          // Balcony ring — bounding box equals exterior footprint (bbox-exterior rule).
          // Body = interior (exterior - 2*material), tabs extend outward by materialThickness
          // to reach the exterior edges. Tab positions distribute across exterior so they
          // align with the wall slots (which are placed in exterior coords).
          //   extW, extD       — exterior footprint dimensions (bbox)
          //   balconyWidth     — visible ring ledge width inside the body
          //   widthTabs, depthTabs — number of tabs along each axis
          const generateBalconyRingPaths = (extW, extD, balconyWidth, widthTabs, depthTabs) => {
            const T = materialThickness;
            const bodyW = extW - 2 * T;
            const bodyD = extD - 2 * T;
            const innerW = Math.max(0.25, bodyW - 2 * balconyWidth);
            const innerD = Math.max(0.25, bodyD - 2 * balconyWidth);

            // Tabs distributed across the EXTERIOR dimension (matches wall slot positions);
            // width follows the same adaptive rule as the wall slots
            const widthTabPos = generateTabPositions(extW, widthTabs, tabWidthFor(extW));
            const depthTabPos = generateTabPositions(extD, depthTabs, tabWidthFor(extD));

            const bL = T, bT = T;                  // body top-left corner
            const bR = T + bodyW, bB = T + bodyD;  // body bottom-right corner

            let outer = `M ${bL} ${bT}`;
            // Top edge — tabs go UP from body top (y=bT) to exterior top (y=0)
            widthTabPos.forEach(t => {
              outer += ` L ${t.start} ${bT} L ${t.start} 0 L ${t.end} 0 L ${t.end} ${bT}`;
            });
            outer += ` L ${bR} ${bT}`;
            // Right edge — tabs go RIGHT from body right (x=bR) to exterior right (x=extW)
            depthTabPos.forEach(t => {
              outer += ` L ${bR} ${t.start} L ${extW} ${t.start} L ${extW} ${t.end} L ${bR} ${t.end}`;
            });
            outer += ` L ${bR} ${bB}`;
            // Bottom edge — tabs go DOWN from body bottom (y=bB) to exterior bottom (y=extD)
            for (let i = widthTabPos.length - 1; i >= 0; i--) {
              const t = widthTabPos[i];
              outer += ` L ${t.end} ${bB} L ${t.end} ${extD} L ${t.start} ${extD} L ${t.start} ${bB}`;
            }
            outer += ` L ${bL} ${bB}`;
            // Left edge — tabs go LEFT from body left (x=bL) to exterior left (x=0)
            for (let i = depthTabPos.length - 1; i >= 0; i--) {
              const t = depthTabPos[i];
              outer += ` L ${bL} ${t.end} L 0 ${t.end} L 0 ${t.start} L ${bL} ${t.start}`;
            }
            outer += ` L ${bL} ${bT} Z`;

            // Inner hole, centered in the body (which is centered in the bbox)
            const innerLeft = (extW - innerW) / 2;
            const innerTop  = (extD - innerD) / 2;
            const inner = `M ${innerLeft} ${innerTop} L ${innerLeft + innerW} ${innerTop} L ${innerLeft + innerW} ${innerTop + innerD} L ${innerLeft} ${innerTop + innerD} Z`;

            return { outer, inner };
          };

          // Window trim — front frame applied to the wall exterior.
          // The 4 window panes are cut directly into the wall (the mullion cross stays as solid
          // wall material), so no back pane is needed — only this trim glues onto the exterior
          // face to give the opening a finished frame.
          //   Outer = opening + 2*margin (wider than wall opening, visible casing on exterior)
          //   Inner = opening - 2*lipSize (SMALLER than wall opening, so a visible frame lip
          //   overlaps the opening edge for a finished look).
          const generateWindowTrimPath = (openW, openH, rawMargin) => {
            // Small fixed lip (~1 mm cut). Big enough to read as a frame at all scales.
            const lip = WINDOW_TRIM_LIP;
            // Floor the trim margin so the outer wing past the opening stays visible and
            // glueable at small scales — especially for gable windows where the architectural
            // 3" casing scales down to under 0.6mm at N scale.
            const margin = Math.max(rawMargin, MIN_TRIM_MARGIN);
            const totalW = openW + 2 * margin;
            const totalH = openH + 2 * margin;
            const innerW = Math.max(openW * 0.6, openW - 2 * lip);
            const innerH = Math.max(openH * 0.6, openH - 2 * lip);
            const innerX = (totalW - innerW) / 2;
            const innerY = (totalH - innerH) / 2;
            const outer = `M 0 0 L ${totalW} 0 L ${totalW} ${totalH} L 0 ${totalH} Z`;
            const inner = `M ${innerX} ${innerY} L ${innerX + innerW} ${innerY} L ${innerX + innerW} ${innerY + innerH} L ${innerX} ${innerY + innerH} Z`;
            return { outer, inner, totalW, totalH };
          };

          // Door panel — floating piece (opening minus clearance, with simple 2-panel detail)
          const generateDoorPanelPath = (openW, openH, clearance) => {
            const w = openW - 2 * clearance;
            const h = openH - 2 * clearance;
            const paths = [];
            paths.push(`M 0 0 L ${w} 0 L ${w} ${h} L 0 ${h} Z`);
            // Two inset panels
            const inset = Math.min(w, h) * 0.12;
            const panelH = (h - 3 * inset) / 2;
            paths.push(`M ${inset} ${inset} L ${w - inset} ${inset} L ${w - inset} ${inset + panelH} L ${inset} ${inset + panelH} Z`);
            paths.push(`M ${inset} ${h - inset - panelH} L ${w - inset} ${h - inset - panelH} L ${w - inset} ${h - inset} L ${inset} ${h - inset} Z`);
            return { paths, w, h };
          };

          // Door trim — front casing applied to the wall exterior.
          // Outer = opening + 2*margin (visible casing on exterior wall face).
          // Inner = opening (matches wall opening — NO lip). The door panel hinges onto
          // the trim's inner edge, so the trim must clear the full opening for the door to swing.
          // Unlike windows, there's nothing to glue a pane behind here.
          const generateDoorTrimPath = (openW, openH, margin, clearance) => {
            const totalW = openW + 2 * margin;
            const totalH = openH + 2 * margin;
            const outer = `M 0 0 L ${totalW} 0 L ${totalW} ${totalH} L 0 ${totalH} Z`;
            const inner = `M ${margin} ${margin} L ${margin + openW} ${margin} L ${margin + openW} ${margin + openH} L ${margin} ${margin + openH} Z`;
            return { outer, inner, totalW, totalH };
          };

          // Balcony slot positions on a wall (2-story, balcony mode only).
          // Slots live in the 1ST-story panel near its top — this places the balcony ring
          // visually between the downstairs and upstairs windows with roughly equal gaps,
          // and keeps the slot entirely inside one panel for a clean cut.
          // bottomY is measured from the 1st-story panel bottom upward (panel-local).
          const computeBalconySlots = (wallKey, wallLengthExterior) => {
            if (stories !== 2 || secondFloorMode !== 'balcony') return [];
            const slotHeight = materialThickness;
            // 2 * materialThickness below the 1st-story panel top edge
            const slotBottomY = scaled.storyHeight - 2 * materialThickness;
            const tabCount = calculateTabCount(wallLengthExterior);
            const tabPositions = generateTabPositions(wallLengthExterior, tabCount, tabWidthFor(wallLengthExterior));
            return tabPositions.map(tp => ({
              type: 'slot',
              leftX: tp.start,
              bottomY: slotBottomY,
              width: tp.end - tp.start,
              height: slotHeight,
            }));
          };

          // Gable window — 2'×2' real-world, centered in the gable triangle.
          // Returns { fits, opening, reason } where opening is in panel-local coords or null.
          // bottomY measured from panel bottom (panel-local), so values > panelHeight fall into peak.
          const computeGableWindow = (wallKey, wallLengthExterior, wallLengthBody, panelHeight) => {
            if (!gableWindows[wallKey]) return { fits: false, opening: null };
            const ridgeAlongWidth = ridgeDirection === 'width';
            const isGable = ridgeAlongWidth
              ? (wallKey === 'left' || wallKey === 'right')
              : (wallKey === 'front' || wallKey === 'back');
            if (!isGable) return { fits: false, opening: null, reason: 'not a gable wall' };
            const w = scaled.gableWindowSize;
            const h = scaled.gableWindowSize;
            // Peak apex above panelHeight by gablePeakCut. Window vertically centered in peak area.
            const windowBottomAbovePanelTop = (gablePeakCut - h) / 2;
            if (windowBottomAbovePanelTop < 0) {
              return { fits: false, opening: null, reason: 'pitch too shallow — peak is too short for the window' };
            }
            // Triangle horizontal extent at window top: wallLengthBody * (1 - topAbovePanelTop / gablePeakCut)
            // For symmetric fit, check top (the narrower point).
            const topAbovePanelTop = windowBottomAbovePanelTop + h;
            const triangleWidthAtTop = wallLengthBody * (1 - topAbovePanelTop / gablePeakCut);
            if (w > triangleWidthAtTop - 2 * scaled.minGap / 4) {
              return { fits: false, opening: null, reason: 'gable too narrow at window height' };
            }
            // Place in exterior coords (will be shifted to body coords by the caller for tabbed walls)
            const centerX = wallLengthExterior / 2;
            return {
              fits: true,
              opening: {
                type: 'gable-window',
                leftX: centerX - w / 2,
                bottomY: panelHeight + windowBottomAbovePanelTop,
                width: w,
                height: h,
              },
              reason: null,
            };
          };

          // ====================================================
          // RUIN PLAN (v2.0) — computed once per state change, consumed by BOTH
          // the SVG generator and the preview so they can never disagree.
          // All wall geometry in the plan is in BODY coordinates (the same frame
          // generateWallPanelPath uses), y measured down from the panel top.
          // ====================================================
          const ruinPlan = useMemo(() => {
            if (condition !== 'ruined' || SCALES[scale].displayOnly) return null;

            const P = DAMAGE_PARAMS[damageLevel];
            const sf = (ft) => (ft * 12) / SCALES[scale].ratio;
            const minWeb = Math.max(0.08, materialThickness);
            const bottomStub = Math.max(3 * materialThickness, 0.3);
            const courseH = Math.max(sf(RUIN_COURSE_FT), RUIN_MIN_SEG * 1.5);
            const runMin = Math.max(sf(RUIN_RUN_MIN_FT), 3 * RUIN_MIN_SEG);
            const runMax = Math.max(sf(RUIN_RUN_MAX_FT), runMin * 2);
            const ridgeAlongWidth = ridgeDirection === 'width';
            const isGableW = (wk) => ridgeAlongWidth
              ? (wk === 'left' || wk === 'right')
              : (wk === 'front' || wk === 'back');
            const wallIndex = { front: 0, back: 1, left: 2, right: 3 };
            const warnings = [];

            // ---- Phase 1: shared corner heights (corner-first rule) ----
            // Each wall states a desired height at each of its two corners; the corner
            // takes the MINIMUM of its two walls' desires, clamped to the stub minimum.
            const desire = {};
            for (const wk of WALL_KEYS) {
              const rng = mulberry32(((ruinSeed * 4 + wallIndex[wk]) ^ 0x9E3779B9) >>> 0);
              const st = ruinStyles[wk];
              const rb = (band) => (band[0] + rng() * (band[1] - band[0])) * totalWallH;
              if (st === 'collapsed') {
                desire[wk] = { left: rb(P.cornerBand), right: rb(P.cornerBand) };
              } else if (st === 'corner') {
                const blowLeft = rng() < 0.5;
                desire[wk] = blowLeft
                  ? { left: rb(P.blownBand), right: rb(P.keptBand) }
                  : { left: rb(P.keptBand), right: rb(P.blownBand) };
              } else {
                desire[wk] = { left: totalWallH, right: totalWallH };
              }
            }
            const cornerH = {};
            // Ruined corner heights snap to the masonry course grid so break-profile
            // endpoints land on whole courses (no sub-minimum slivers at the corners).
            const minCornerGrid = Math.ceil(RUIN_MIN_CORNER / courseH) * courseH;
            const maxCornerGrid = Math.floor(totalWallH / courseH) * courseH;
            for (const c of CORNER_KEYS) {
              let h = totalWallH;
              for (const wk of WALL_KEYS) {
                for (const side of ['left', 'right']) {
                  if (WALL_CORNERS[wk][side] === c) h = Math.min(h, desire[wk][side]);
                }
              }
              if (h >= totalWallH - 1e-9) {
                cornerH[c] = totalWallH; // untouched corner — keep exact full height
              } else {
                const q = Math.round(h / courseH) * courseH;
                cornerH[c] = Math.min(maxCornerGrid, Math.max(minCornerGrid, q));
              }
            }

            // ---- Phase 2: per-wall break profiles and breaches ----
            // Balcony slot band (panel coords) for the slot-survival check
            const slotTopY = totalWallH - ((scaled.storyHeight - 2 * materialThickness) + materialThickness);
            const balconyRequested = stories === 2 && secondFloorMode === 'balcony';
            let balconyOK = balconyRequested;

            const walls = {};
            for (const wk of WALL_KEYS) {
              const st = ruinStyles[wk];
              const isGable = isGableW(wk);
              const isWidthWall = wk === 'front' || wk === 'back';
              const wallLength = isWidthWall ? scaled.footprintWidth : scaled.footprintDepth;
              const bodyLength = isGable ? wallLength : wallLength - 2 * materialThickness;
              const openingShift = isGable ? 0 : materialThickness;
              const leftJoinH = cornerH[WALL_CORNERS[wk].left];
              const rightJoinH = cornerH[WALL_CORNERS[wk].right];

              // User openings (all stories) in body coords
              let openings = [];
              for (let s = 1; s <= stories; s++) {
                const layout = computeWallLayout(wallLength, s, wallConfig[s][wk]);
                for (const op of layout.openings) {
                  openings.push({ ...op, leftX: op.leftX - openingShift });
                }
              }
              // Gable window survives only on walls whose style keeps the peak
              const keepsTop = st === 'intact' || st === 'breach';
              if (isGable && gableWindows[wk]) {
                const gw = computeGableWindow(wk, wallLength, bodyLength, scaled.storyHeight);
                if (gw.fits) {
                  if (keepsTop) {
                    openings.push({
                      ...gw.opening,
                      leftX: gw.opening.leftX - openingShift,
                      bottomY: gw.opening.bottomY + (stories - 1) * scaled.storyHeight,
                    });
                  } else {
                    warnings.push(`${WALL_LABELS[wk]} wall: gable window removed — the ${RUIN_STYLE_LABELS[st].toLowerCase()} ruin takes the peak with it.`);
                  }
                }
              }

              let profile = null;
              const holePaths = [];
              let slotSafe = st === 'intact';
              const rng = mulberry32((ruinSeed * 1013 + wallIndex[wk] * 101 + 7) >>> 0);

              if (st === 'collapsed' || st === 'corner') {
                const raw = buildBreakProfile(
                  rng, bodyLength,
                  totalWallH - leftJoinH, totalWallH - rightJoinH,
                  totalWallH, P.sag, courseH, runMin, runMax,
                  totalWallH - bottomStub
                );
                let runs = profileToRuns(raw);
                // Classify each opening against the break: keep / drop / absorb
                const kept = [];
                for (const op of openings) {
                  const opTop = totalWallH - op.bottomY - op.height;
                  const opBottom = totalWallH - op.bottomY;
                  const { mn, mx } = rangeMinMaxY(runs, op.leftX, op.leftX + op.width);
                  if (mx <= opTop - minWeb) { kept.push(op); continue; }       // fully below break, good web
                  if (mn >= opBottom - 1e-9) continue;                          // fully in the rubble — dropped
                  runs = absorbIntoRuns(runs, op.leftX, op.leftX + op.width, opBottom, RUIN_MIN_SEG);
                }
                openings = kept;
                runs = smoothRuns(runs, RUIN_MIN_SEG);
                profile = sanitizePts(runsToPts(runs));
                // Slots survive only if the whole break stays above the slot band with web
                const whole = rangeMinMaxY(runs, 0, bodyLength);
                slotSafe = whole.mx <= slotTopY - minWeb;
              } else if (st === 'breach') {
                const edgeMargin = Math.max(2 * minWeb, 2 * materialThickness, 0.15);
                const topMargin = minWeb + courseH;
                const bw = Math.min((P.breachW[0] + rng() * (P.breachW[1] - P.breachW[0])) * bodyLength,
                                    bodyLength - 2 * edgeMargin);
                const bh = (P.breachH[0] + rng() * (P.breachH[1] - P.breachH[0])) * scaled.storyHeight;
                if (bw > 0.3 && bh > 0.3) {
                  const cx = bodyLength * (0.35 + rng() * 0.3);
                  let rect = {
                    l: Math.max(edgeMargin, cx - bw / 2),
                    r: Math.min(bodyLength - edgeMargin, cx + bw / 2),
                    b: Math.min(totalWallH - bottomStub, totalWallH - bottomStub - rng() * 0.15 * scaled.storyHeight),
                  };
                  rect.t = Math.max(topMargin, rect.b - bh);
                  // Absorb any opening the breach touches (or comes within a web of)
                  let changed = true;
                  while (changed) {
                    changed = false;
                    openings = openings.filter(op => {
                      const opTop = totalWallH - op.bottomY - op.height;
                      const opBottom = totalWallH - op.bottomY;
                      const apart = op.leftX > rect.r + minWeb || op.leftX + op.width < rect.l - minWeb ||
                                    opTop > rect.b + minWeb || opBottom < rect.t - minWeb;
                      if (apart) return true;
                      rect.l = Math.max(edgeMargin, Math.min(rect.l, op.leftX));
                      rect.r = Math.min(bodyLength - edgeMargin, Math.max(rect.r, op.leftX + op.width));
                      rect.t = Math.max(topMargin, Math.min(rect.t, opTop));
                      rect.b = Math.max(rect.b, opBottom);   // may reach a door's base strip
                      changed = true;
                      return false;
                    });
                  }
                  holePaths.push(buildJaggedRect(rng, rect.l, rect.t, rect.r, rect.b, courseH, runMin, runMax));
                  // Slots survive if the breach (plus a web margin) stays clear of the slot band
                  const bandTop = slotTopY, bandBottom = slotTopY + materialThickness;
                  slotSafe = (rect.b + minWeb < bandTop) || (rect.t - minWeb > bandBottom);
                } else {
                  slotSafe = true; // breach too small to cut — wall is effectively intact
                }
              }

              if (!slotSafe) balconyOK = false;
              walls[wk] = {
                style: st, profile, holePaths,
                leftJoinH, rightJoinH,
                survivingOpenings: openings,
              };
            }

            // ---- Phase 3: balcony slots (only if every wall passed the slot check) ----
            if (balconyRequested && balconyOK) {
              for (const wk of WALL_KEYS) {
                const isGable = isGableW(wk);
                const isWidthWall = wk === 'front' || wk === 'back';
                const wallLength = isWidthWall ? scaled.footprintWidth : scaled.footprintDepth;
                const openingShift = isGable ? 0 : materialThickness;
                for (const sl of computeBalconySlots(wk, wallLength)) {
                  walls[wk].survivingOpenings.push({ ...sl, leftX: sl.leftX - openingShift });
                }
              }
            }
            if (balconyRequested && !balconyOK) {
              warnings.push('Balcony ring disabled — every wall must still be standing at the slot line for the ring to plug in.');
            }

            const roofEligible = WALL_KEYS.filter(isGableW).every(wk => ruinStyles[wk] === 'intact');

            return { walls, cornerH, balconyOK, balconyRequested, roofEligible, warnings };
          }, [condition, scale, damageLevel, ruinSeed, ruinStyles, scaled, stories, wallConfig,
              secondFloorMode, gableWindows, ridgeDirection, materialThickness, totalWallH, gablePeakCut]);

          // Roof / balcony presence for the whole tool (SVG, preview, bed check)
          const roofIncluded = condition === 'intact' || (ruinPlan && ruinPlan.roofEligible && includeRuinRoof);
          const balconyActive = stories === 2 && secondFloorMode === 'balcony' && (!ruinPlan || ruinPlan.balconyOK);

          // ====================================================
          // WALL LAYOUT (all 4 walls, per story) — used for both SVG and preview
          // ====================================================
          const buildAllWallLayouts = () => {
            const result = {};
            const ridgeAlongWidth = ridgeDirection === 'width';
            for (const wallKey of WALL_KEYS) {
              const isWidthWall = wallKey === 'front' || wallKey === 'back';
              const wallLengthCut = isWidthWall ? scaled.footprintWidth : scaled.footprintDepth;
              // A wall is GABLED when its length is perpendicular to the ridge
              // ridge 'width' => ridge runs along width => gable walls are LEFT/RIGHT (depth-oriented)
              // Wait — if ridge runs along width, the gable triangles are on the walls whose length = width
              // Actually: the gable END walls are the ones perpendicular to the ridge.
              // Ridge along width => gables on LEFT and RIGHT walls (whose length = depth, facing width-direction)
              // Let me re-derive: ridge runs along footprint.width (long dimension of roof) =>
              // roof peak runs parallel to width => gable triangles are on walls where the wall length = depth
              // Hmm, this depends on convention. Let's define:
              // ridgeAlongWidth=true means ridge runs in the +X (width) direction.
              // Then the gable ends are on the FRONT and BACK walls (which span the width).
              // Wait no — front and back span width, so if ridge runs along width, front/back walls
              // are UNDER the eave (not gabled). The gabled walls are left/right.
              //
              // Let me think geometrically:
              // Footprint: width along X, depth along Y
              // Roof with ridge along width: ridge is a line parallel to X at the top, running over the center
              // The two roof slopes go from the ridge down to the eaves on the +Y and -Y sides
              // So the eave walls are front (+Y) and back (-Y), which are the walls spanning X (width)
              // The gable triangles are on the left (-X) and right (+X) walls, which span Y (depth)
              //
              // Correction: if ridge runs along width (X), then
              //   - front/back walls = EAVE walls (width-spanning)
              //   - left/right walls = GABLE walls (depth-spanning)
              const isGable = ridgeAlongWidth
                ? (wallKey === 'left' || wallKey === 'right')
                : (wallKey === 'front' || wallKey === 'back');

              const perStory = [];
              for (let s = 1; s <= stories; s++) {
                const cfg = wallConfig[s][wallKey];
                const layout = computeWallLayout(wallLengthCut, s, cfg);
                perStory.push({ story: s, wallLength: wallLengthCut, layout, config: cfg });
              }
              result[wallKey] = { wallLength: wallLengthCut, isGable, perStory };
            }
            return result;
          };

          // ====================================================
          // WALL PIECES (v2.0) — single source of truth for the four wall panels,
          // consumed by BOTH generateSVG and the preview. Applies the ruin plan
          // when the building is ruined; reproduces v1.1 assembly when intact.
          // ====================================================
          const buildWallPieces = () => {
            const wallLayouts = buildAllWallLayouts();
            const pieces = [];
            for (const wallKey of WALL_KEYS) {
              const { wallLength, isGable, perStory } = wallLayouts[wallKey];
              const panelHeight = totalWallH;
              // Gable-notch rule: gable walls notched (body = exterior), eave walls tabbed (body = interior)
              const leftEdge = isGable ? 'notches' : 'tabs';
              const rightEdge = isGable ? 'notches' : 'tabs';
              const bodyLength = isGable ? wallLength : wallLength - 2 * materialThickness;
              const openingShift = isGable ? 0 : materialThickness;
              const bottomEdge = includeFloor ? 'tabs' : 'plain';
              const wp = ruinPlan ? ruinPlan.walls[wallKey] : null;

              let openings, extraHolePaths, topEdge, leftJoinH, rightJoinH;
              if (wp) {
                openings = wp.survivingOpenings;
                extraHolePaths = wp.holePaths;
                topEdge = wp.profile
                  ? { type: 'ruin', profile: wp.profile }
                  : (isGable ? { type: 'gable', peakHeight: gablePeakCut } : { type: 'flat' });
                leftJoinH = wp.leftJoinH;
                rightJoinH = wp.rightJoinH;
              } else {
                // Intact building — identical to v1.1 assembly
                openings = [];
                extraHolePaths = [];
                for (const s of perStory) {
                  for (const op of s.layout.openings) {
                    openings.push({ type: op.type, leftX: op.leftX - openingShift, bottomY: op.bottomY, width: op.width, height: op.height });
                  }
                }
                if (stories === 2 && secondFloorMode === 'balcony') {
                  for (const sl of computeBalconySlots(wallKey, wallLength)) {
                    openings.push({ type: 'slot', leftX: sl.leftX - openingShift, bottomY: sl.bottomY, width: sl.width, height: sl.height });
                  }
                }
                if (isGable) {
                  const gw = computeGableWindow(wallKey, wallLength, bodyLength, scaled.storyHeight);
                  if (gw.fits) {
                    openings.push({
                      type: 'gable-window',
                      leftX: gw.opening.leftX - openingShift,
                      bottomY: gw.opening.bottomY + (stories - 1) * scaled.storyHeight,
                      width: gw.opening.width,
                      height: gw.opening.height,
                    });
                  }
                }
                topEdge = isGable ? { type: 'gable', peakHeight: gablePeakCut } : { type: 'flat' };
              }

              const { outline, openingPaths } = generateWallPanelPath({
                wallLength: bodyLength,
                panelHeight,
                leftEdge, rightEdge, bottomEdge,
                topEdge,
                openings,
                bottomDistributeAcross: wallLength,
                leftJoinH, rightJoinH,
              });

              const bboxExtraLeft = (leftEdge === 'tabs') ? materialThickness : 0;
              const bboxExtraRight = (rightEdge === 'tabs') ? materialThickness : 0;
              const bboxExtraTop = (topEdge.type === 'gable') ? gablePeakCut : 0;
              const bboxExtraBottom = (bottomEdge === 'tabs') ? materialThickness : 0;

              pieces.push({
                name: `${wallKey}-wall`,
                wallKey,
                label: WALL_LABELS[wallKey],
                outline,
                openingPaths: [...openingPaths, ...extraHolePaths],
                bodyLength,
                bboxW: bodyLength + bboxExtraLeft + bboxExtraRight,
                bboxH: panelHeight + bboxExtraTop + bboxExtraBottom,
                offsetX: bboxExtraLeft,
                offsetY: bboxExtraTop,
              });
            }
            return pieces;
          };

          const validation = useMemo(() => {
            const warnings = [];
            const ridgeAlongWidth = ridgeDirection === 'width';
            for (const wallKey of WALL_KEYS) {
              const isWidthWall = wallKey === 'front' || wallKey === 'back';
              const wallLengthCut = isWidthWall ? scaled.footprintWidth : scaled.footprintDepth;
              for (let s = 1; s <= stories; s++) {
                const cfg = wallConfig[s][wallKey];
                const { overflow, requiredLength } = computeWallLayout(wallLengthCut, s, cfg);
                if (overflow) {
                  const reqFt = requiredLength * (SCALES[scale].ratio / 12);
                  const haveFt = wallLengthCut * (SCALES[scale].ratio / 12);
                  warnings.push(`${WALL_LABELS[wallKey]} wall (story ${s}): ${cfg.door !== 'none' ? 'door + ' : ''}${cfg.windows} window${cfg.windows === 1 ? '' : 's'} needs ${reqFt.toFixed(1)} ft, wall is ${haveFt.toFixed(1)} ft wide.`);
                }
              }
              // Gable window fit check (top story only)
              if (gableWindows[wallKey]) {
                const isGable = ridgeAlongWidth ? (wallKey === 'left' || wallKey === 'right') : (wallKey === 'front' || wallKey === 'back');
                if (!isGable) {
                  warnings.push(`${WALL_LABELS[wallKey]} wall: gable window is enabled but this isn't a gable wall (ridge direction is Along ${ridgeAlongWidth ? 'Width' : 'Depth'}).`);
                } else {
                  const bodyLen = isWidthWall ? wallLengthCut - 2 * materialThickness : wallLengthCut;
                  const gw = computeGableWindow(wallKey, wallLengthCut, bodyLen, scaled.storyHeight);
                  if (!gw.fits) {
                    warnings.push(`${WALL_LABELS[wallKey]} wall: gable window won't fit — ${gw.reason || 'peak too small for a 2-ft window'}.`);
                  }
                }
              }
            }
            // Ruin-plan warnings (v2.0): dropped gable windows, disabled balcony
            if (ruinPlan) warnings.push(...ruinPlan.warnings);
            return warnings;
          }, [scale, footprintWidthFt, footprintDepthFt, stories, wallConfig, scaled, gableWindows, ridgeDirection, roofPitch, gablePeakCut, materialThickness, ruinPlan]);

          // ====================================================
          // SVG GENERATION (laser bed layout)
          // ====================================================
          const generateSVG = useCallback(() => {
            const spacing = 0.25;
            const tabDepth = materialThickness;
            const wallLayouts = buildAllWallLayouts();
            const ratioFt = SCALES[scale].ratio / 12;

            // Layout: 4 wall panels per row 1, roof+floor+balcony in row 2,
            // window trims in row 3, door pieces in row 4.

            // Compute per-wall panel dims
            // Panel length = wallLength (unchanged)
            // Panel height = storyHeight (for 1-story eave walls: panelHeight = storyHeight; gable walls include peak on top)
            // For 2-story: each story gets its own panel; peak only on TOP story's gable wall.

            // Each wall is ONE panel spanning all stories. Built by the shared
            // buildWallPieces() (also feeds the preview), which applies the ruin plan
            // when the building is ruined and reproduces v1.1 assembly when intact.
            const allPanels = buildWallPieces();

            // Roof slopes — two rectangles, with overhang on all three exposed edges
            // (both gable ends along the ridge + the eave side of each slope). The ridge
            // edge where the two slopes meet gets no overhang.
            const ridgeAlongWidth = ridgeDirection === 'width';
            const footprintRidgeDim = ridgeAlongWidth ? scaled.footprintWidth : scaled.footprintDepth;
            const ridgeRunFt = ridgeAlongWidth ? footprintDepthFt : footprintWidthFt;
            const ridgeRunCut = (ridgeRunFt * 12) / SCALES[scale].ratio;
            const eaveToRidgeHypotenuse = (ridgeRunCut / 2) / Math.cos(pitchRad);
            const overhang = scaled.roofOverhang;
            const ridgeLength = footprintRidgeDim + 2 * overhang;      // extend past both gable ends
            const slopeWidth  = eaveToRidgeHypotenuse + overhang;       // extend past eave (one side only)
            const roofSlopePath = generateRoofSlopePath(ridgeLength, slopeWidth);

            // Ground floor (any story count) + optional 2-story balcony ring.
            // Ground floor = exterior footprint with inward notches (5-sided-box bottom convention).
            const extW = scaled.footprintWidth;
            const extD = scaled.footprintDepth;
            let floorPath = null;
            if (includeFloor) {
              floorPath = generateFloorPath(extW, extD, calculateTabCount(extW), calculateTabCount(extD));
            }
            let balconyPaths = null;
            if (balconyActive) {
              balconyPaths = generateBalconyRingPaths(extW, extD, balconyWidth, calculateTabCount(extW), calculateTabCount(extD));
            }

            // Collect trim pieces — one per unique opening across all walls.
            // Window panes are cut directly into the wall (mullion = solid wall material),
            // so only the front trim is generated as a separate piece.
            // Ruined buildings (v2.0): only openings that SURVIVED intact get trim/door
            // pieces — battle-damaged openings are part of the broken silhouette.
            const windowTrims = [];
            const doorPieces = [];
            if (ruinPlan) {
              for (const wallKey of WALL_KEYS) {
                for (const op of ruinPlan.walls[wallKey].survivingOpenings) {
                  if (op.type === 'window' || op.type === 'gable-window') {
                    windowTrims.push({ w: op.width, h: op.height });
                  } else if (op.type === 'door') {
                    doorPieces.push({ w: op.width, h: op.height });
                  }
                }
              }
            } else {
              for (const wallKey of WALL_KEYS) {
                const { wallLength, perStory } = wallLayouts[wallKey];
                // Top-story bodyLength (needed for gable window fit check)
                const isWidthWall = wallKey === 'front' || wallKey === 'back';
                const bodyLenTop = isWidthWall ? wallLength - 2 * materialThickness : wallLength;
                const gwCheck = computeGableWindow(wallKey, wallLength, bodyLenTop, scaled.storyHeight);
                if (gwCheck.fits) {
                  windowTrims.push({ w: gwCheck.opening.width, h: gwCheck.opening.height });
                }
                for (const s of perStory) {
                  for (const op of s.layout.openings) {
                    if (op.type === 'window') {
                      windowTrims.push({ w: op.width, h: op.height });
                    } else if (op.type === 'door') {
                      doorPieces.push({ w: op.width, h: op.height });
                    }
                  }
                }
              }
            }

            // ===== LAYOUT =====
            // Rows:
            //   1: all wall panels
