            //   2: roof slopes (x2) + ridge cap + floor + balcony (if present)
            //   3: window trim (one frame per window — panes are cut directly in the walls)
            //   4: door pieces (trim + floating panel per door)

            let currentY = 0;
            let rowMaxH = 0;

            // Row 1: walls
            let wallsRow = [];
            let x = 0;
            for (const p of allPanels) {
              wallsRow.push({ ...p, x, y: currentY });
              x += p.bboxW + spacing;
              rowMaxH = Math.max(rowMaxH, p.bboxH);
            }
            const row1Width = x - spacing;
            currentY += rowMaxH + spacing;

            // Row 2: roof + floor. Ruined buildings (v2.0) only get roof pieces when both
            // gable walls are intact AND the user asked to include the roof.
            let row2 = [];
            x = 0;
            rowMaxH = 0;
            if (roofIncluded) {
              // Roof slope 1
              row2.push({ type: 'roof', path: roofSlopePath, w: ridgeLength, h: slopeWidth, x, y: currentY, label: 'Roof 1' });
              x += ridgeLength + spacing;
              rowMaxH = Math.max(rowMaxH, slopeWidth);
              // Roof slope 2
              row2.push({ type: 'roof', path: roofSlopePath, w: ridgeLength, h: slopeWidth, x, y: currentY, label: 'Roof 2' });
              x += ridgeLength + spacing;
              // Ridge cap — thin rectangle sized ridgeLength × materialThickness.
              // Glued between the two roof slopes at the apex to fill the angular gap and
              // give the peak a crisp line.
              const ridgeCapPath = `M 0 0 L ${ridgeLength} 0 L ${ridgeLength} ${materialThickness} L 0 ${materialThickness} Z`;
              row2.push({ type: 'ridge-cap', path: ridgeCapPath, w: ridgeLength, h: materialThickness, x, y: currentY, label: 'Ridge' });
              x += ridgeLength + spacing;
              rowMaxH = Math.max(rowMaxH, materialThickness);
            }
            if (floorPath) {
              row2.push({ type: 'floor', path: floorPath, w: extW, h: extD, x, y: currentY, label: 'Floor' });
              x += extW + spacing;
              rowMaxH = Math.max(rowMaxH, extD);
            }
            if (balconyPaths) {
              row2.push({ type: 'balcony', paths: balconyPaths, w: extW, h: extD, x, y: currentY, label: 'Balcony' });
              x += extW + spacing;
              rowMaxH = Math.max(rowMaxH, extD);
            }
            const row2Width = x - spacing;
            currentY += rowMaxH + spacing;

            // Row 3: window trim (one per window — panes are cut into the wall)
            let row3 = [];
            x = 0;
            rowMaxH = 0;
            for (let i = 0; i < windowTrims.length; i++) {
              const ins = windowTrims[i];
              const trim = generateWindowTrimPath(ins.w, ins.h, scaled.trimMargin);
              row3.push({ type: 'win-trim', outer: trim.outer, inner: trim.inner, w: trim.totalW, h: trim.totalH, x, y: currentY, label: `Win ${i+1} trim` });
              x += trim.totalW + spacing;
              rowMaxH = Math.max(rowMaxH, trim.totalH);
            }
            const row3Width = x - spacing;
            if (windowTrims.length > 0) currentY += rowMaxH + spacing;

            // Row 4: door pieces (trim + floating panel)
            let row4 = [];
            x = 0;
            rowMaxH = 0;
            for (let i = 0; i < doorPieces.length; i++) {
              const ins = doorPieces[i];
              const trim = generateDoorTrimPath(ins.w, ins.h, scaled.doorTrimMargin, doorClearance);
              row4.push({ type: 'door-trim', outer: trim.outer, inner: trim.inner, w: trim.totalW, h: trim.totalH, x, y: currentY, label: `Door ${i+1} trim` });
              x += trim.totalW + spacing;
              const panel = generateDoorPanelPath(ins.w, ins.h, doorClearance);
              row4.push({ type: 'door-panel', paths: panel.paths, w: panel.w, h: panel.h, x, y: currentY, label: `Door ${i+1} panel` });
              x += panel.w + spacing;
              rowMaxH = Math.max(rowMaxH, trim.totalH, panel.h);
            }
            const row4Width = x - spacing;
            if (doorPieces.length > 0) currentY += rowMaxH + spacing;

            const totalWidth  = Math.max(row1Width, row2Width, row3Width, row4Width, 1);
            const totalHeight = currentY;
            const svgW = convertFromInches(totalWidth);
            const svgH = convertFromInches(totalHeight);

            let svg = `<?xml version="1.0" encoding="UTF-8"?>\n`;
            svg += `<!-- Generated by Scale Model Building Designer v2.0.0 - https://greylightmay.com -->\n`;
            svg += `<!-- Scale: ${SCALES[scale].label} | Footprint: ${footprintWidthFt}x${footprintDepthFt} ft | Stories: ${stories} -->\n`;
            if (ruinPlan) {
              svg += `<!-- Ruined: ${damageLevel} damage, seed ${ruinSeed} | Walls: ${WALL_KEYS.map(wk => `${wk}=${ruinStyles[wk]}`).join(' ')} -->\n`;
            }
            svg += `<svg width="${svgW}${units === 'mm' ? 'mm' : 'in'}" height="${svgH}${units === 'mm' ? 'mm' : 'in'}" viewBox="0 0 ${totalWidth} ${totalHeight}" xmlns="http://www.w3.org/2000/svg">\n`;
            svg += `  <defs><style>.cut-line { stroke: rgb(255,0,0); stroke-width: 0.01; fill: none; }</style></defs>\n`;

            // Wall panels
            for (const p of wallsRow) {
              svg += `  <g id="${p.name}" transform="translate(${p.x + p.offsetX}, ${p.y + p.offsetY})">\n`;
              svg += `    <path d="${p.outline}" class="cut-line" />\n`;
              for (const op of p.openingPaths) {
                svg += `    <path d="${op}" class="cut-line" />\n`;
              }
              svg += `  </g>\n`;
            }
            // Row 2
            for (const r of row2) {
              if (r.type === 'balcony') {
                svg += `  <g transform="translate(${r.x}, ${r.y})">\n`;
                svg += `    <path d="${r.paths.outer}" class="cut-line" />\n`;
                svg += `    <path d="${r.paths.inner}" class="cut-line" />\n`;
                svg += `  </g>\n`;
              } else {
                svg += `  <g transform="translate(${r.x}, ${r.y})"><path d="${r.path}" class="cut-line" /></g>\n`;
              }
            }
            // Row 3 (window trim)
            for (const r of row3) {
              svg += `  <g transform="translate(${r.x}, ${r.y})">\n`;
              svg += `    <path d="${r.outer}" class="cut-line" />\n`;
              svg += `    <path d="${r.inner}" class="cut-line" />\n`;
              svg += `  </g>\n`;
            }
            // Row 4 (door pieces)
            for (const r of row4) {
              svg += `  <g transform="translate(${r.x}, ${r.y})">\n`;
              if (r.type === 'door-panel') {
                for (const pp of r.paths) svg += `    <path d="${pp}" class="cut-line" />\n`;
              } else {
                svg += `    <path d="${r.outer}" class="cut-line" />\n`;
                svg += `    <path d="${r.inner}" class="cut-line" />\n`;
              }
              svg += `  </g>\n`;
            }

            svg += `</svg>`;
            return { svg, totalWidth, totalHeight, layout: { wallsRow, row2, row3, row4 } };
          }, [scale, footprintWidthFt, footprintDepthFt, stories, roofPitch, ridgeDirection, includeFloor, secondFloorMode, balconyWidth, wallConfig, gableWindows, doorClearance, materialThickness, units, scaled, gablePeakCut, pitchRad,
              condition, damageLevel, ruinSeed, ruinStyles, ruinPlan, includeRuinRoof]);

          // ====================================================
          // BED FIT CHECK
          // ====================================================
          const bedCheck = useMemo(() => {
            const { totalWidth, totalHeight, layout } = generateSVG();
            // Largest piece
            let largest = { w: 0, h: 0, name: 'none' };
            for (const p of layout.wallsRow) {
              if (p.bboxW * p.bboxH > largest.w * largest.h) largest = { w: p.bboxW, h: p.bboxH, name: p.label };
            }
            for (const r of layout.row2) {
              if (r.w * r.h > largest.w * largest.h) largest = { w: r.w, h: r.h, name: r.label };
            }
            const fits = largest.w <= bedSize.width && largest.h <= bedSize.height;
            const tight = largest.w > bedSize.width - 0.5 || largest.h > bedSize.height - 0.5;
            return { fits, tight, largest };
          }, [generateSVG, bedSize]);

          // ====================================================
          // DOWNLOAD
          // ====================================================
          const downloadSVG = () => {
            gtag('event', 'download_svg', { 'tool_name': 'scale_model_building_designer' });
            const { svg } = generateSVG();
            const blob = new Blob([svg], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            const safe = filename.replace(/[^a-zA-Z0-9-_]/g, '-').replace(/-+/g, '-') || 'building';
            const ruinTag = condition === 'ruined' ? `-ruined-s${ruinSeed}` : '';
            link.download = `${safe}-${scale}-${footprintWidthFt}x${footprintDepthFt}ft-${stories}story${ruinTag}.svg`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
          };

          // ====================================================
          // INPUT HANDLERS
          // ====================================================
          const handleFootprintChange = (field, value) => {
            const v = parseFloat(value);
            if (isNaN(v) || v < 6) return;
            if (field === 'width') setFootprintWidthFt(v);
            else setFootprintDepthFt(v);
          };

          const handleWallConfig = (story, wallKey, field, value) => {
            setWallConfig(prev => ({
              ...prev,
              [story]: {
                ...prev[story],
                [wallKey]: {
                  ...prev[story][wallKey],
                  [field]: field === 'windows' ? parseInt(value) : value
                }
              }
            }));
          };

          const handleThicknessChange = (value) => {
            const v = parseFloat(value);
            if (!isNaN(v) && v > 0) setMaterialThickness(convertToInches(v));
          };

          const handleBalconyChange = (value) => {
            const v = parseFloat(value);
            if (!isNaN(v) && v >= 0.25) setBalconyWidth(convertToInches(v));
          };

          const handleDoorClearanceChange = (value) => {
            const v = parseFloat(value);
            if (!isNaN(v) && v >= 0) setDoorClearance(convertToInches(v));
          };

          const handleRuinSeedChange = (value) => {
            const v = parseInt(value, 10);
            if (!isNaN(v) && v >= 0) setRuinSeed(v);
          };

          const rerollRuins = () => {
            const next = ruinSeed + 1;
            setRuinSeed(next);
            setRuinSeedInput(String(next));
          };

          // ====================================================
          // RENDER
          // ====================================================
          const wallPiecesForPreview = buildWallPieces();

          // Dev/test hook: lets automated checks read the ruin plan and the exact
          // piece paths without parsing the preview DOM. No effect on the UI.
          window.__smbDebug = { ruinPlan, wallPieces: wallPiecesForPreview, totalWallH, materialThickness, scale, stories };

          return (
            <div className="max-w-7xl mx-auto p-6 bg-white">
              <h1 className="text-3xl font-bold text-center mb-2 text-gray-800">Scale Model Building Designer</h1>
              <p className="text-center text-gray-600 mb-1">Wargaming terrain and model railroad buildings with lift-off gable roofs — now with ruined variants</p>
              <p className="text-center text-gray-500 text-sm mb-8">v2.0.0</p>

              <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                {/* Settings Column */}
                <div className="space-y-6">

                  {/* Scale */}
                  <div className="bg-gray-50 p-6 rounded-lg">
                    <h2 className="text-xl font-semibold text-gray-700 mb-4">Scale</h2>
                    <select value={scale} onChange={e => setScale(e.target.value)} className="w-full px-3 py-2 border border-gray-300 rounded">
                      {Object.entries(SCALES).map(([k, v]) => (
                        <option key={k} value={k}>{v.label}</option>
                      ))}
                    </select>
                    <p className="text-xs text-gray-500 mt-2">All real-world dimensions (doors, windows, story height) are scaled from this ratio.</p>
                  </div>

                  {/* Footprint */}
                  <div className="bg-gray-50 p-6 rounded-lg">
                    <h2 className="text-xl font-semibold text-gray-700 mb-4">Footprint (real-world feet)</h2>
                    <div className="grid grid-cols-2 gap-4">
                      <div>
                        <label className="block text-sm font-medium text-gray-600 mb-1">Width (ft)</label>
                        <input type="number" value={footprintWidthInput} onChange={e => { setFootprintWidthInput(e.target.value); handleFootprintChange('width', e.target.value); }} step="1" min="6" className="w-full px-3 py-2 border border-gray-300 rounded" />
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-gray-600 mb-1">Depth (ft)</label>
                        <input type="number" value={footprintDepthInput} onChange={e => { setFootprintDepthInput(e.target.value); handleFootprintChange('depth', e.target.value); }} step="1" min="6" className="w-full px-3 py-2 border border-gray-300 rounded" />
                      </div>
                    </div>
                    <div className="mt-3 pt-3 border-t border-gray-200 text-sm text-gray-600">
                      <p>At {scale} scale:</p>
                      <p className="text-gray-700">Cut size: {formatUnit(convertFromInches(scaled.footprintWidth))} × {formatUnit(convertFromInches(scaled.footprintDepth))} {units}</p>
                      <p className="text-gray-700">Story height: {formatUnit(convertFromInches(scaled.storyHeight))} {units}</p>
                    </div>
                  </div>

                  {/* Stories */}
                  <div className="bg-gray-50 p-6 rounded-lg">
                    <h2 className="text-xl font-semibold text-gray-700 mb-4">Stories</h2>
                    <div className="flex gap-4">
                      <label className="flex items-center cursor-pointer"><input type="radio" checked={stories === 1} onChange={() => setStories(1)} className="mr-2" /><span>1 Story</span></label>
                      <label className="flex items-center cursor-pointer"><input type="radio" checked={stories === 2} onChange={() => setStories(2)} className="mr-2" /><span>2 Stories</span></label>
                    </div>
                  </div>

                  {/* Condition (v2.0 ruins) — wargaming scales only */}
                  <div className="bg-gray-50 p-6 rounded-lg">
                    <h2 className="text-xl font-semibold text-gray-700 mb-4">Condition</h2>
                    {SCALES[scale].displayOnly ? (
                      <p className="text-sm text-gray-600">
                        Ruined buildings are a wargaming feature — available at 32mm, 28mm, and 15mm scales.
                      </p>
                    ) : (
                      <>
                        <div className="flex gap-4 mb-1">
                          <label className="flex items-center cursor-pointer"><input type="radio" checked={condition === 'intact'} onChange={() => setCondition('intact')} className="mr-2" /><span>Intact</span></label>
                          <label className="flex items-center cursor-pointer"><input type="radio" checked={condition === 'ruined'} onChange={() => setCondition('ruined')} className="mr-2" /><span>Ruined</span></label>
                        </div>
                        {condition === 'ruined' && (
                          <div className="mt-3 pt-3 border-t border-gray-200 space-y-4">
                            <div>
                              <label className="block text-sm font-medium text-gray-600 mb-1">Damage level</label>
                              <select value={damageLevel} onChange={e => setDamageLevel(e.target.value)} className="w-full px-3 py-2 border border-gray-300 rounded">
                                <option value="light">Light</option>
                                <option value="medium">Medium</option>
                                <option value="heavy">Heavy</option>
                              </select>
                            </div>
                            <div>
                              <label className="block text-sm font-medium text-gray-600 mb-1">Ruin style per wall</label>
                              <div className="grid grid-cols-2 gap-2">
                                {WALL_KEYS.map(wk => (
                                  <div key={wk} className="bg-white p-2 rounded border border-gray-200">
                                    <label className="block text-xs text-gray-600 mb-1">{WALL_LABELS[wk]}</label>
                                    <select
                                      value={ruinStyles[wk]}
                                      onChange={e => setRuinStyles(prev => ({ ...prev, [wk]: e.target.value }))}
                                      className="w-full px-2 py-1 text-sm border border-gray-300 rounded"
                                    >
                                      {Object.entries(RUIN_STYLE_LABELS).map(([k, label]) => (
                                        <option key={k} value={k}>{label}</option>
                                      ))}
                                    </select>
                                  </div>
                                ))}
                              </div>
                            </div>
                            <div>
                              <label className="block text-sm font-medium text-gray-600 mb-1">Variant</label>
                              <div className="flex gap-2">
                                <input
                                  type="number" min="0" step="1" value={ruinSeedInput}
                                  onChange={e => { setRuinSeedInput(e.target.value); handleRuinSeedChange(e.target.value); }}
                                  className="w-28 px-3 py-2 border border-gray-300 rounded"
                                />
                                <button onClick={rerollRuins} className="flex-1 bg-gray-700 text-white py-2 px-4 rounded hover:bg-gray-800 transition-colors text-sm font-semibold">
                                  🎲 Re-roll ruins
                                </button>
                              </div>
                              <p className="text-xs text-gray-500 mt-1">Every number is a different ruin. Note the number to re-create a favorite.</p>
                            </div>
                          </div>
                        )}
                      </>
                    )}
                  </div>

                  {/* Roof */}
                  <div className="bg-gray-50 p-6 rounded-lg">
                    <h2 className="text-xl font-semibold text-gray-700 mb-4">Roof</h2>
                    <div className="mb-4">
                      <label className="block text-sm font-medium text-gray-600 mb-1">Pitch</label>
                      <select value={roofPitch} onChange={e => setRoofPitch(parseInt(e.target.value))} className="w-full px-3 py-2 border border-gray-300 rounded">
                        {ROOF_PITCHES.map(p => <option key={p.value} value={p.value}>{p.label}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-gray-600 mb-1">Ridge Direction</label>
                      <div className="flex gap-4">
                        <label className="flex items-center cursor-pointer"><input type="radio" checked={ridgeDirection === 'width'} onChange={() => setRidgeDirection('width')} className="mr-2" /><span>Along Width</span></label>
                        <label className="flex items-center cursor-pointer"><input type="radio" checked={ridgeDirection === 'depth'} onChange={() => setRidgeDirection('depth')} className="mr-2" /><span>Along Depth</span></label>
                      </div>
                      <p className="text-xs text-gray-500 mt-1">Gable ends will be on the walls perpendicular to the ridge.</p>
                    </div>
                    {condition === 'ruined' && (
                      <div className="mt-3 pt-3 border-t border-gray-200">
                        {ruinPlan && ruinPlan.roofEligible ? (
                          <label className="flex items-center cursor-pointer">
                            <input type="checkbox" checked={includeRuinRoof} onChange={e => setIncludeRuinRoof(e.target.checked)} className="mr-3 h-4 w-4" />
                            <span className="text-sm">Include roof (ruins usually go without)</span>
                          </label>
                        ) : (
                          <p className="text-sm text-gray-600">
                            No roof on this ruin — both gable walls must be Intact for the roof to have something to rest on.
                          </p>
                        )}
                      </div>
                    )}
                  </div>

                  {/* Floor — ground floor always available; balcony only for 2-story non-HO */}
                  <div className="bg-gray-50 p-6 rounded-lg">
                    <h2 className="text-xl font-semibold text-gray-700 mb-4">Floor</h2>
                    <label className="flex items-center cursor-pointer mb-3">
                      <input type="checkbox" checked={includeFloor} onChange={e => setIncludeFloor(e.target.checked)} className="mr-3 h-4 w-4" />
                      <span>Include ground floor panel</span>
                    </label>
                    {stories === 2 && (
                      SCALES[scale].displayOnly ? (
                        <p className="text-sm text-gray-600 mt-2 pt-3 border-t border-gray-200">
                          Second-story floors aren't generated at this scale — the building is display-only and doesn't need interior access.
                        </p>
                      ) : (
                        <div className="mt-2 pt-3 border-t border-gray-200">
                          <label className="block text-sm font-medium text-gray-600 mb-2">Second story</label>
                          <div className="space-y-1">
                            <label className="flex items-center cursor-pointer"><input type="radio" checked={secondFloorMode === 'none'} onChange={() => setSecondFloorMode('none')} className="mr-2" /><span>None</span></label>
                            <label className="flex items-center cursor-pointer"><input type="radio" checked={secondFloorMode === 'balcony'} onChange={() => setSecondFloorMode('balcony')} className="mr-2" /><span>Balcony ring (wargaming)</span></label>
                          </div>
                          {secondFloorMode === 'balcony' && (
                            <div className="mt-3">
                              <label className="block text-sm text-gray-600 mb-1">Balcony width ({units})</label>
                              <input type="number" value={balconyWidthInput} onChange={e => { setBalconyWidthInput(e.target.value); handleBalconyChange(e.target.value); }} step={units === 'mm' ? '1' : '0.125'} className="w-full px-3 py-2 border border-gray-300 rounded" />
                              <p className="text-xs text-gray-500 mt-1">~1" fits a standard miniature base.</p>
                            </div>
                          )}
                        </div>
                      )
                    )}
                  </div>

                  {/* Per-Wall Configuration */}
                  <div className="bg-gray-50 p-6 rounded-lg">
                    <h2 className="text-xl font-semibold text-gray-700 mb-4">Wall Configuration</h2>
                    {Array.from({ length: stories }, (_, i) => i + 1).map(s => (
                      <div key={s} className="mb-4">
                        {stories === 2 && <h3 className="font-medium text-gray-700 mb-2">Story {s}</h3>}
                        <div className="grid grid-cols-2 gap-3">
                          {WALL_KEYS.map(wk => {
                            const ridgeAlongWidth = ridgeDirection === 'width';
                            const isGableWall = ridgeAlongWidth
                              ? (wk === 'left' || wk === 'right')
                              : (wk === 'front' || wk === 'back');
                            const isTopStory = s === stories;
                            return (
                              <div key={wk} className="bg-white p-3 rounded border border-gray-200">
                                <div className="font-medium text-gray-700 text-sm mb-2">{WALL_LABELS[wk]}{isGableWall ? ' (gable)' : ''}</div>
                                <div className="mb-2">
                                  <label className="block text-xs text-gray-600 mb-1">Door</label>
                                  <select value={wallConfig[s][wk].door} onChange={e => handleWallConfig(s, wk, 'door', e.target.value)} className="w-full px-2 py-1 text-sm border border-gray-300 rounded">
                                    <option value="none">None</option>
                                    <option value="left">Left</option>
                                    <option value="center">Center</option>
                                    <option value="right">Right</option>
                                  </select>
                                </div>
                                <div className={isGableWall && isTopStory ? 'mb-2' : ''}>
                                  <label className="block text-xs text-gray-600 mb-1">Windows</label>
                                  <select value={wallConfig[s][wk].windows} onChange={e => handleWallConfig(s, wk, 'windows', e.target.value)} className="w-full px-2 py-1 text-sm border border-gray-300 rounded">
                                    <option value="0">0</option>
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3 (no door)</option>
                                  </select>
                                </div>
                                {isGableWall && isTopStory && (
                                  <label className="flex items-center text-xs text-gray-600 cursor-pointer">
                                    <input type="checkbox" checked={gableWindows[wk]} onChange={e => setGableWindows(prev => ({ ...prev, [wk]: e.target.checked }))} className="mr-2" />
                                    Gable (attic) window
                                  </label>
                                )}
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    ))}
                  </div>

                  {/* Validation */}
                  {validation.length > 0 && (
                    <div className="bg-yellow-50 border border-yellow-200 p-4 rounded-lg">
                      <h3 className="font-semibold text-yellow-800 mb-2">Layout warnings</h3>
                      <ul className="text-sm text-yellow-700 list-disc pl-5 space-y-1">
                        {validation.map((w, i) => <li key={i}>{w}</li>)}
                      </ul>
                    </div>
                  )}

                  {/* Door Clearance */}
                  <div className="bg-gray-50 p-6 rounded-lg">
                    <h2 className="text-xl font-semibold text-gray-700 mb-4">Door Clearance</h2>
                    <label className="block text-sm text-gray-600 mb-1">Gap around floating door panel ({units})</label>
                    <input type="number" value={doorClearanceInput} onChange={e => { setDoorClearanceInput(e.target.value); handleDoorClearanceChange(e.target.value); }} step={units === 'mm' ? '0.1' : '0.005'} className="w-full px-3 py-2 border border-gray-300 rounded" />
                    <p className="text-xs text-gray-500 mt-1">0.03" typical. Door floats in trim; builder adds hinges.</p>
                  </div>

                  {/* Units */}
                  <div className="bg-gray-50 p-6 rounded-lg">
                    <h2 className="text-xl font-semibold text-gray-700 mb-4">Units (cut dimensions)</h2>
                    <div className="flex gap-4">
                      <label className="flex items-center cursor-pointer"><input type="radio" checked={units === 'inches'} onChange={() => setUnits('inches')} className="mr-2" /><span>Inches</span></label>
                      <label className="flex items-center cursor-pointer"><input type="radio" checked={units === 'mm'} onChange={() => setUnits('mm')} className="mr-2" /><span>Millimeters</span></label>
                    </div>
                    <p className="text-xs text-gray-500 mt-2">Footprint is always in real-world feet; this toggle affects the cut SVG and material thickness.</p>
                  </div>

                  {/* Material Thickness */}
                  <div className="bg-gray-50 p-6 rounded-lg">
                    <h2 className="text-xl font-semibold text-gray-700 mb-4">Material Thickness</h2>
                    <select value={materialPreset} onChange={e => { setMaterialPreset(e.target.value); if (e.target.value !== 'custom') setCustomThickness(''); }} className="w-full px-3 py-2 border border-gray-300 rounded">
                      {units === 'inches' ? (
                        <>
                          <option value="0.0625">1/16" (0.0625")</option>
                          <option value="0.0787">Nominal 1/16" / 2mm (0.0787")</option>
                          <option value="0.125">1/8" (0.125")</option>
                          <option value="0.118">Nominal 1/8" (0.118")</option>
                          <option value="0.25">1/4" (0.250")</option>
                          <option value="0.236">Nominal 1/4" (0.236")</option>
                        </>
                      ) : (
                        <>
                          <option value="1.5875">1.5875mm (1/16")</option>
                          <option value="2.0">2.0mm</option>
                          <option value="3.0">3.0mm</option>
                          <option value="3.175">3.175mm (1/8")</option>
                          <option value="6.0">6.0mm</option>
                          <option value="6.35">6.35mm (1/4")</option>
                        </>
                      )}
                      <option value="custom">Custom</option>
                    </select>
                    {materialPreset === 'custom' && (
                      <input type="number" value={customThickness} onChange={e => { setCustomThickness(e.target.value); handleThicknessChange(e.target.value); }} placeholder={`Enter thickness in ${units}`} step={units === 'mm' ? '0.1' : '0.001'} className="w-full mt-2 px-3 py-2 border border-gray-300 rounded" />
                    )}
                    <p className="text-xs text-gray-500 mt-2">Current: {formatUnit(convertFromInches(materialThickness))} {units}</p>
                  </div>

                  {/* Bed Size Check */}
                  <div className="bg-gray-50 p-6 rounded-lg">
                    <h2 className="text-xl font-semibold text-gray-700 mb-4">Material Size Check</h2>
                    <select value={bedPreset} onChange={e => { setBedPreset(e.target.value); if (e.target.value !== 'custom') { const [w, h] = e.target.value.split('x').map(Number); setBedSize({ width: w, height: h }); } }} className="w-full px-3 py-2 border border-gray-300 rounded">
                      <option value="12x12">12" x 12"</option>
                      <option value="12x20">12" x 20"</option>
                      <option value="20x28">20" x 28"</option>
                      <option value="24x36">24" x 36"</option>
                      <option value="40x28">40" x 28"</option>
                      <option value="custom">Custom</option>
                    </select>
                    {bedPreset === 'custom' && (
                      <div className="grid grid-cols-2 gap-2 mt-2">
                        <input type="number" placeholder="Width" value={customBedWidth} onChange={e => { setCustomBedWidth(e.target.value); const v = parseFloat(e.target.value); if (!isNaN(v) && v > 0) setBedSize(p => ({ ...p, width: v })); }} className="px-3 py-2 border border-gray-300 rounded" />
                        <input type="number" placeholder="Height" value={customBedHeight} onChange={e => { setCustomBedHeight(e.target.value); const v = parseFloat(e.target.value); if (!isNaN(v) && v > 0) setBedSize(p => ({ ...p, height: v })); }} className="px-3 py-2 border border-gray-300 rounded" />
                      </div>
                    )}
                    <div className={`mt-3 rounded p-3 border ${bedCheck.fits ? (bedCheck.tight ? 'bg-yellow-50 border-yellow-200' : 'bg-green-50 border-green-200') : 'bg-red-50 border-red-200'}`}>
                      <p className={`font-semibold ${bedCheck.fits ? (bedCheck.tight ? 'text-yellow-800' : 'text-green-800') : 'text-red-800'}`}>
                        {bedCheck.fits ? (bedCheck.tight ? 'Tight fit — verify carefully' : 'All pieces fit') : "Won't fit!"}
                      </p>
                      <p className="text-sm">Largest: {bedCheck.largest.w.toFixed(2)}" x {bedCheck.largest.h.toFixed(2)}" ({bedCheck.largest.name})</p>
                      {!bedCheck.fits && <p className="text-sm">Bed: {bedSize.width}" x {bedSize.height}"</p>}
                    </div>
                  </div>

                  {/* Color Guide */}
                  <div className="bg-gray-50 p-4 rounded-lg border border-gray-200 text-sm">
                    <h3 className="font-semibold text-gray-700 mb-2">SVG Color Guide</h3>
                    <div className="space-y-1 text-gray-600">
                      <p>Red = Cut lines</p>
                      <p>Blue = Scoring/line engraving</p>
                      <p>Black = Raster/fill engraving</p>
                    </div>
                  </div>

                  {/* Filename */}
                  <div className="bg-gray-50 p-6 rounded-lg">
                    <h2 className="text-xl font-semibold text-gray-700 mb-4">Filename</h2>
                    <div className="flex items-center">
                      <input type="text" value={filename} onChange={e => setFilename(e.target.value)} placeholder="e.g., painted-lady" className="flex-1 px-3 py-2 border border-gray-300 rounded-l" />
                      <span className="px-3 py-2 bg-gray-200 border border-l-0 border-gray-300 rounded-r text-gray-600">.svg</span>
                    </div>
                  </div>

                  <button onClick={downloadSVG} className="w-full bg-blue-600 text-white py-3 px-6 rounded-lg hover:bg-blue-700 transition-colors font-semibold">
                    Download Building SVG
                  </button>
                </div>

                {/* Preview Column */}
                <div className="space-y-4">
                  <div className="flex items-center justify-between">
                    <h2 className="text-xl font-semibold text-gray-700">Preview</h2>
                    <select value={zoomLevel} onChange={e => setZoomLevel(parseFloat(e.target.value))} className="px-2 py-1 border border-gray-300 rounded text-sm">
                      <option value={0.25}>25%</option>
                      <option value={0.5}>50%</option>
                      <option value={1}>100%</option>
                      <option value={1.5}>150%</option>
                      <option value={2}>200%</option>
                    </select>
                  </div>

                  <BuildingPreview
                    wallPieces={wallPiecesForPreview}
                    scaled={scaled}
                    stories={stories}
                    ridgeDirection={ridgeDirection}
                    gablePeakCut={gablePeakCut}
                    materialThickness={materialThickness}
                    zoomLevel={zoomLevel}
                    includeFloor={includeFloor}
                    balconyWidth={balconyWidth}
                    calculateTabCount={calculateTabCount}
                    generateFloorPath={generateFloorPath}
                    generateRoofSlopePath={generateRoofSlopePath}
                    generateBalconyRingPaths={generateBalconyRingPaths}
                    pitchRad={pitchRad}
                    roofIncluded={roofIncluded}
                    balconyActive={balconyActive}
                  />

                  <div className="text-sm text-gray-600 space-y-1">
                    <p><strong>Assembly:</strong></p>
                    <p>Walls sit on top of floor (tabs into notches)</p>
                    <p>Gable walls have triangular peaks</p>
                    <p>Roof slopes rest on angled wall tops — lift off for interior access</p>
                    <p>Window/door trim glues to exterior. Door panel floats; add your own hinges.</p>
                    {condition === 'ruined' && (
                      <p>Ruined corners still lock together — every standing corner keeps at least one tab, and the glue line runs the full surviving height.</p>
                    )}
                  </div>
                </div>
              </div>
            </div>
          );
        };

        // ====================================================
        // PREVIEW COMPONENT — copies 5-sided-box cross layout for the 4 walls + floor
        // Adds roof slopes and gable triangles using the same alignment rules.
        // ====================================================
        const BuildingPreview = (props) => {
          const {
            wallPieces, scaled, stories, ridgeDirection, gablePeakCut,
            materialThickness, zoomLevel, includeFloor, balconyWidth,
            calculateTabCount, generateFloorPath,
            generateRoofSlopePath, generateBalconyRingPaths, pitchRad,
            roofIncluded, balconyActive,
          } = props;

          const ridgeAlongWidth = ridgeDirection === 'width';
          const exteriorW = scaled.footprintWidth;
          const exteriorD = scaled.footprintDepth;
          const storyH = scaled.storyHeight;
          const totalWallH = storyH * stories;

          // Which walls are gable-ended
          const isGableWall = (wk) => ridgeAlongWidth
            ? (wk === 'left' || wk === 'right')
            : (wk === 'front' || wk === 'back');

          // Does this building have any floor? Governs bottom-edge tabs.
          const hasAnyFloor = includeFloor;

          // Wall pieces come pre-built from the shared buildWallPieces() (v2.0) —
          // the exact same paths that go into the downloaded SVG.
          const byKey = {};
          for (const p of wallPieces) byKey[p.wallKey] = p;
          const backWall  = byKey.back;
          const frontWall = byKey.front;
          const leftWall  = byKey.left;
          const rightWall = byKey.right;

          // Floor path
          const showFloor = hasAnyFloor;
          const floorPath = generateFloorPath(exteriorW, exteriorD,
            calculateTabCount(exteriorW), calculateTabCount(exteriorD));

          // Roof slopes — with overhang past gable ends and eave
          const footprintRidgeDim = ridgeAlongWidth ? exteriorW : exteriorD;
          const ridgeRunCut = ridgeAlongWidth ? exteriorD : exteriorW;
          const eaveToRidgeHypotenuse = (ridgeRunCut / 2) / Math.cos(pitchRad);
          const overhang = scaled.roofOverhang;
          const ridgeLength = footprintRidgeDim + 2 * overhang;
          const slopeWidth  = eaveToRidgeHypotenuse + overhang;
          const roofPath = generateRoofSlopePath(ridgeLength, slopeWidth);

          // ===== VIEWBOX =====
          // Gable peaks extend vertically on front/back when ridge is along depth,
          // or horizontally on left/right when ridge is along width.
          const peakExtraV = ridgeAlongWidth ? 0 : gablePeakCut;
          const peakExtraH = ridgeAlongWidth ? gablePeakCut : 0;

          // Pad scales with content so tall 2-story + Victorian pitch doesn't clip the peaks
          const vbPad = Math.max(1, totalWallH * 0.25, gablePeakCut * 0.15);
          const gap = 0.25;
          const roofGap = 0.5;
          const wallToRoofGap = 1;

          // Equal gap between all four walls and floor
          const wallFloorGap = gap;

          const xMin = -peakExtraH - vbPad;
          const xMax = exteriorD + gap + exteriorW + gap + totalWallH + peakExtraH + vbPad;
          const yMin = -wallFloorGap - totalWallH - peakExtraV - vbPad;
          const yMaxWalls = exteriorD + wallFloorGap + totalWallH + peakExtraV;
          const showBalconyPiece = balconyActive;
          const balconyExtraH = showBalconyPiece ? exteriorD + 0.5 : 0;
          // Roof rows only occupy preview space when the roof is generated (v2.0: ruins usually have none)
          const roofRowsH = roofIncluded ? wallToRoofGap + slopeWidth + roofGap + slopeWidth : 0.5;
          const yMax = yMaxWalls + roofRowsH + balconyExtraH + vbPad;

          const vbWidth = xMax - xMin;
          const vbHeight = yMax - yMin;

          // BBOX alignment:
          //   Width walls (tabbed L/R): body drawn starting at materialThickness inside the bbox edge
          //   Depth walls (notched L/R): body IS the bbox on the main axis
          const mat = materialThickness;
          // Tabbed (eave) walls need their body shifted by material so tab tips align with floor corners.
          // Notched (gable) walls have body = exterior already — no shift.
          const backBodyOffsetX  = isGableWall('back')  ? 0 : mat;
          const frontBodyOffsetX = isGableWall('front') ? 0 : mat;

          return (
            <div className="border border-gray-300 rounded-lg p-4 bg-white" style={{ maxHeight: '800px', width: '100%', overflowX: 'auto', overflowY: 'auto' }}>
              <div className="text-center mb-4">
                <p className="text-sm text-gray-600 font-semibold">Unfolded Building</p>
                <p className="text-xs text-gray-500">Walls in cross layout; roof slopes below</p>
              </div>
              <svg
                width={`${vbWidth * 96 * zoomLevel}px`}
                height={`${vbHeight * 96 * zoomLevel}px`}
                viewBox={`${xMin} ${yMin} ${vbWidth} ${vbHeight}`}
                style={{ background: '#f9fafb', display: 'block' }}
              >
                <defs>
                  <style>{`
                    .cut-line { stroke: #dc2626; stroke-width: 0.02; fill: #f3e5ab; }
                    .opening  { stroke: #dc2626; stroke-width: 0.02; fill: #ffffff; }
                    .label    { fill: #10b981; font-family: Arial; font-size: 0.28px; }
                  `}</style>
                </defs>

                {/* Back Wall — gap above floor to match the L/R sides */}
                <g transform={`translate(${exteriorD + gap + backBodyOffsetX}, ${-wallFloorGap - totalWallH})`}>
                  <path d={backWall.outline} className="cut-line" />
                  {backWall.openingPaths.map((p, i) => <path key={i} d={p} className="opening" />)}
                  <text className="label" x={backWall.bodyLength / 2} y={-0.4} textAnchor="middle">Back</text>
                </g>

                {/* Middle row: Left | Floor | Right */}
                <g transform={`translate(0, 0)`}>
                  {/* Left wall — rotated -90, body offset = 0 (notched) */}
                  <g transform={`translate(${exteriorD}, ${exteriorD / 2}) rotate(-90) translate(${-leftWall.bodyLength / 2}, ${-totalWallH})`}>
                    <path d={leftWall.outline} className="cut-line" />
                    {leftWall.openingPaths.map((p, i) => <path key={i} d={p} className="opening" />)}
                    <text className="label" x={leftWall.bodyLength / 2} y={-0.3} textAnchor="middle">Left</text>
                  </g>

                  {/* Floor */}
                  <g transform={`translate(${exteriorD + gap}, 0)`}>
                    {showFloor ? (
                      <path d={floorPath} className="cut-line" />
                    ) : (
                      <rect x="0" y="0" width={exteriorW} height={exteriorD} fill="#f3f4f6" stroke="#d1d5db" strokeWidth="0.02" strokeDasharray="0.1,0.1" />
                    )}
                    <text className="label" x={exteriorW / 2} y={exteriorD / 2} textAnchor="middle" dominantBaseline="middle">{showFloor ? 'Floor' : 'footprint'}</text>
                  </g>

                  {/* Right wall — rotated +90, body offset = 0 (notched) */}
                  <g transform={`translate(${exteriorD + gap + exteriorW + gap + totalWallH}, ${exteriorD / 2}) rotate(90) translate(${-rightWall.bodyLength / 2}, 0)`}>
                    <path d={rightWall.outline} className="cut-line" />
                    {rightWall.openingPaths.map((p, i) => <path key={i} d={p} className="opening" />)}
                    <text className="label" x={rightWall.bodyLength / 2} y={-0.3} textAnchor="middle">Right</text>
                  </g>
                </g>

                {/* Front Wall — rotated 180, with matching gap to floor */}
                <g transform={`translate(${exteriorD + gap + exteriorW / 2}, ${exteriorD + wallFloorGap + totalWallH}) rotate(180) translate(${-frontWall.bodyLength / 2}, 0)`}>
                  <path d={frontWall.outline} className="cut-line" />
                  {frontWall.openingPaths.map((p, i) => <path key={i} d={p} className="opening" />)}
                  <text className="label" x={frontWall.bodyLength / 2} y={-0.3} textAnchor="middle">Front</text>
                </g>

                {/* Roof slopes below front wall (omitted on most ruins) */}
                {roofIncluded && (
                  <>
                    <g transform={`translate(${exteriorD + gap + (exteriorW - ridgeLength) / 2}, ${yMaxWalls + wallToRoofGap})`}>
                      <path d={roofPath} className="cut-line" />
                      <text className="label" x={ridgeLength / 2} y={slopeWidth / 2} textAnchor="middle" dominantBaseline="middle" fill="#6b7280">Roof A</text>
                    </g>
                    <g transform={`translate(${exteriorD + gap + (exteriorW - ridgeLength) / 2}, ${yMaxWalls + wallToRoofGap + slopeWidth + roofGap})`}>
                      <path d={roofPath} className="cut-line" />
                      <text className="label" x={ridgeLength / 2} y={slopeWidth / 2} textAnchor="middle" dominantBaseline="middle" fill="#6b7280">Roof B</text>
                    </g>
                  </>
                )}

                {/* Balcony ring — separate piece below roofs */}
                {showBalconyPiece && (() => {
                  const bp = generateBalconyRingPaths(exteriorW, exteriorD, balconyWidth, calculateTabCount(exteriorW), calculateTabCount(exteriorD));
                  const balconyY = yMaxWalls + roofRowsH + 0.5;
                  return (
                    <g transform={`translate(${exteriorD + gap + (exteriorW - exteriorW) / 2}, ${balconyY})`}>
                      <path d={bp.outer} className="cut-line" />
                      <path d={bp.inner} className="opening" />
                      <text className="label" x={exteriorW / 2} y={exteriorD / 2} textAnchor="middle" dominantBaseline="middle" fill="#6b7280">Balcony</text>
                    </g>
                  );
                })()}
              </svg>
            </div>
          );
        };

        ReactDOM.render(<BuildingDesigner />, document.getElementById('root'));
    </script>
</body>
</html>
